<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Processing Progress — Sermon Library</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .progress-header { display: flex; gap: 2rem; margin: 1.5rem 0; flex-wrap: wrap; }
    .stat { background: var(--surface); padding: 1rem 1.5rem; border-radius: 8px; text-align: center; }
    .stat-num { font-size: 2rem; font-weight: 700; color: var(--accent); }
    .stat-label { font-size: .85rem; color: var(--muted); }
    .ep-list { margin-top: 1rem; }
    .ep-item { display: flex; gap: 1rem; padding: .6rem .5rem; border-bottom: 1px solid var(--border); align-items: center; }
    .ep-item.done { opacity: .55; }
    .ep-item.done .ep-title { text-decoration: line-through; }
    .ep-date { min-width: 90px; color: var(--muted); font-size: .85rem; }
    .ep-feed { min-width: 70px; font-size: .75rem; padding: .15rem .4rem; border-radius: 4px; background: var(--surface); }
    .ep-title { flex: 1; }
    .ep-title a { color: inherit; text-decoration: none; }
    .ep-title a:hover { text-decoration: underline; }
    .check { color: var(--accent); font-weight: 700; min-width: 1.2rem; }
    .filter-bar { display: flex; gap: .5rem; margin: 1rem 0; }
    .filter-bar button { padding: .4rem .8rem; border: 1px solid var(--border); background: var(--surface); border-radius: 4px; cursor: pointer; }
    .filter-bar button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  </style>
</head>
<body>
<header class="site-header">
  <a href="index.html">&#128218; Sermon & Study Library</a>
  <nav class="header-nav">
    <a href="series.html">Series</a>
    <a href="topics.html">Topics</a>
    <a href="scripture.html">Scripture</a>
    <a href="progress.html">Progress</a>
  </nav>
</header>
<div class="container">
  <h1 class="page-title">Processing Progress</h1>
  <p class="page-subtitle" id="generated"></p>
  <div class="progress-header">
    <div class="stat"><div class="stat-num" id="total">–</div><div class="stat-label">Total</div></div>
    <div class="stat"><div class="stat-num" id="done">–</div><div class="stat-label">Done</div></div>
    <div class="stat"><div class="stat-num" id="remaining">–</div><div class="stat-label">Remaining</div></div>
  </div>
  <div class="filter-bar">
    <button class="active" data-filter="all">All</button>
    <button data-filter="remaining">Remaining</button>
    <button data-filter="done">Done</button>
  </div>
  <div class="ep-list" id="ep-list"></div>
</div>
<script>
let data = null;
let filter = 'all';
fetch('progress.json?v=' + Date.now()).then(r => r.json()).then(d => {
  data = d;
  document.getElementById('generated').textContent = 'Updated ' + d.generated;
  document.getElementById('total').textContent = d.total;
  document.getElementById('done').textContent = d.done;
  document.getElementById('remaining').textContent = d.remaining;
  render();
});
document.querySelectorAll('.filter-bar button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-bar button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filter = btn.dataset.filter;
    render();
  });
});
function render() {
  if (!data) return;
  const list = document.getElementById('ep-list');
  const items = data.episodes.filter(e => {
    if (filter === 'remaining') return !e.done;
    if (filter === 'done') return e.done;
    return true;
  });
  list.innerHTML = items.map(e => `
    <div class="ep-item ${e.done ? 'done' : ''}">
      <span class="check">${e.done ? '✓' : ''}</span>
      <span class="ep-date">${e.date || '—'}</span>
      <span class="ep-feed">${e.feed}</span>
      <span class="ep-title"><a href="${e.link}" target="_blank">${e.title}</a></span>
    </div>
  `).join('');
}
</script>
</body>
</html>
