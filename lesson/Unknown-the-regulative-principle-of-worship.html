window.LESSON_DATA = {"title": "The Regulative Principle of Worship", "speaker": "Unknown Speaker", "date": "Unknown", "session": "", "series": null, "series_part": null, "parts": 1, "summary": "This sermon explores the regulative principle of worship (RPW), the Reformed doctrine that God alone directs how we should worship Him through His Word. The speaker defends this principle through three arguments: from Scripture, from doctrine, and from happiness, demonstrating that God cares deeply about how He is worshiped and that proper worship contributes to spiritual formation and obedience.", "outline": [{"title": "Definition and Overview of the Regulative Principle of Worship", "subpoints": ["The RPW states that only those things commanded in Scripture or necessarily deduced from Scripture should be used in corporate worship", "Distinguished from the normative principle, which permits anything not expressly forbidden", "The hallmark of Reformed and Presbyterian worship", "Articulated in the Westminster Confession of Faith, Chapter 21"], "scripture": ["Westminster Confession of Faith 21:1", "Ecclesiastes 5:1"]}, {"title": "Elements and Circumstances of Worship", "subpoints": ["Elements are the non-negotiables of worship: preaching, prayer, singing, Lord's Supper, baptism, giving, confession of sin", "Circumstances are the manner and context of performing elements: time, location, dress, frequency", "Light of nature assists in determining circumstances but not elements", "Elements are commanded; circumstances may be altered based on context"], "scripture": ["Westminster Confession of Faith 21"]}, {"title": "Argument from Scripture: The Second Commandment", "subpoints": ["God's jealousy for His name and glory demonstrates He cares how He is worshiped", "The Second Commandment prohibits graven images and reveals that worship must follow God's prescribed way", "Worship shapes our understanding of God; wrong worship leads to wrong doctrine", "God's self-revelation in Scripture must control our conception of Him"], "scripture": ["Exodus 20:4-5", "Leviticus 10 (Nadab and Abihu)", "Genesis 4 (Cain and Abel)"]}, {"title": "Argument from Scripture: New Testament Passages", "subpoints": ["Jesus seeks true worshipers who worship in spirit and truth (John 4:23-24)", "Paul regulates worship practices, even those concerning spiritual gifts (1 Corinthians 14:26-33)", "Worship devised by men has no value in restraining indulgence of the flesh (Colossians 2:16-23)", "God desires worshipers not merely willing but obedient to His prescribed way"], "scripture": ["John 4:23-24", "John 17:17", "1 Corinthians 14:26-33", "Colossians 2:16-23"]}, {"title": "Argument from Doctrine: Our Nature as Fallen and Finite Creatures", "subpoints": ["Total depravity means our reason is corrupted by sin and cannot reliably guide our worship", "The heart is desperately sick and cannot be our guide; we need God's revelation to direct us", "Only God's sovereign, wise, and unerring intellect can properly instruct us in worship", "Worship is supernatural and requires divine law, not natural law, to be properly understood", "John Calvin emphasized God's right to assert dominion through His law to prevent superstition"], "scripture": ["Jeremiah 17:9", "Proverbs 28:26"]}, {"title": "Argument from Doctrine: The Nature of God's Sovereignty and Glory", "subpoints": ["God's sovereignty requires that worship follow His prescribed pattern, not human preference", "Worship is God-centered, not people-centered; we must prefer God's glory to personal enjoyment", "Biblical content in worship ensures God-centered rather than man-centered services", "How we worship reflects what we believe about who God is"], "scripture": []}, {"title": "Argument from Happiness: Obedience and Spiritual Fulfillment", "subpoints": ["Happiness is bound up with holiness, which is bound up with obedience", "God's limitations and regulations are meant for our good, not our harm", "True freedom comes from choosing right limitations rather than avoiding all limitations", "God's law is a curb to keep us on the path of satisfaction and fulfillment, not a cage of restriction", "Corporate worship is one of the most important ways to cleave to God and find true happiness"], "scripture": ["Genesis 3 (Eve and the Fall)"]}], "tags": [{"tag": "Regulative Principle of Worship", "source": "detected"}, {"tag": "Reformed Theology", "source": "detected"}, {"tag": "Worship", "source": "detected"}, {"tag": "God's Sovereignty", "source": "detected"}, {"tag": "Obedience", "source": "detected"}, {"tag": "Biblical Authority", "source": "detected"}], "scripture_references": [{"reference": "Ecclesiastes 5:1", "type": "quoted", "source": "detected"}, {"reference": "Westminster Confession of Faith 21:1", "type": "quoted", "source": "detected"}, {"reference": "Exodus 20:4-5", "type": "quoted", "source": "detected"}, {"reference": "Leviticus 10", "type": "referenced", "source": "detected"}, {"reference": "Genesis 4", "type": "referenced", "source": "detected"}, {"reference": "John 4:23-24", "type": "quoted", "source": "detected"}, {"reference": "John 17:17", "type": "quoted", "source": "detected"}, {"reference": "1 Corinthians 14:26-33", "type": "referenced", "source": "detected"}, {"reference": "Colossians 2:16-23", "type": "referenced", "source": "detected"}, {"reference": "Jeremiah 17:9", "type": "referenced", "source": "detected"}, {"reference": "Proverbs 28:26", "type": "referenced", "source": "detected"}, {"reference": "Psalm 100", "type": "referenced", "source": "detected"}, {"reference": "Genesis 3", "type": "referenced", "source": "detected"}], "transcript": "## Introduction and Welcome\n\nThank you for the hospitality and welcome you have shown me this weekend. The highlight of being here is to worship with God's people in a new place. Your singing has already ministered to my soul.\n\nThis morning I want to consider worship with you—something I am passionate about. Specifically, I want to focus on what we call the regulative principle of worship, also known by the acronym RPW.\n\n## What Is the Regulative Principle of Worship?\n\nThe regulative principle of worship is the hallmark of Reformed and Presbyterian worship. It makes our worship distinct not only from Roman Catholic and Eastern Orthodox communions, but also from broadly evangelical churches. It is something unique to the Reformed tradition.\n\nThe regulative principle simply states that **God alone directs how we ought to worship Him, and He does that in His Word.**\n\nThere are two main approaches to how Scripture should instruct us in worship:\n\n**The Regulative Principle** says that only those things which receive a positive command in Scripture, or by good and necessary consequence can be deduced from Scripture, should be used in the corporate worship of God's people.\n\n**The Normative Principle** says that as long as something is not expressly forbidden by Scripture, it can be permitted in worship.\n\nBoth views attempt to let Scripture regulate worship, but they do so in different ways. We get much of this understanding from the Westminster Confession of Faith, Chapter One, and it comes into greater clarity in Chapter 21.\n\n### Westminster Confession on Worship\n\nFrom the Confession of Faith, Chapter 21, Paragraph 1:\n\n> \"The light of nature shows that there is a God who has power and sovereignty over all, is good and does good to all, and is therefore to be feared, loved, praised, obeyed, trusted in, and served with all the heart and with all the soul and with all the might. The acceptable way of worshiping the true God is instituted by Himself and so limited by His own will, that He may not be worshiped according to the imaginations and vices of men or the suggestions of Satan under any visible representation, or in any other way not prescribed in Holy Scripture.\"\n\nWhen the Reformers put this into writing, it was standard Reformed teaching. The whole series of Reformed Confessions and all the best Reformed theologians were drawn upon to aid the Westminster Assembly in this definition. The Directory for Worship, which the assembly also produced, states in its introduction:\n\n> \"In the beginning of the Blessed Reformation, our wise and pious ancestors took care to set forth an order for the redress of many things which they, by the Word, discovered to be vain, erroneous, superstitious, and idolatrous in the public worship of God.\"\n\nThe regulative principle is the chief principle in the production of the Directory. It is what dictates these men as they put together what a Reformed worship service should look like.\n\n## Elements and Circumstances of Worship\n\nThe regulative principle distinguishes between two categories of worship:\n\n### Elements of Worship\n\nElements are the non-negotiables—the heartbeat of a worship service. These are things the Bible clearly commands should be included in worship:\n\n- Preaching of the Word\n- Singing and praise\n- Prayer\n- The Lord's Supper\n- Baptism\n- Giving\n- Confession of sin\n- Confession of faith\n\nThese elements are derived from Scripture and are essential to corporate worship.\n\n### Circumstances of Worship\n\nCircumstances are how the elements are performed. They may be altered depending on your context:\n\n- What time does the service meet? (10 a.m. or 1 p.m.)\n- Must there be evening worship or afternoon service?\n- What should the preacher wear?\n- How frequently should we gather?\n\nThe light of nature helps us in determining the circumstances of worship. For example, the elders of a church might realize that people are coming from different places and want them to worship twice on the Lord's Day with many opportunities to be together in the Word. But it might not be wise to make them come back at six o'clock at night, so you might have lunch and a worship service after. The elements remain, but the circumstances differ based on context.\n\n## Why We Need the Regulative Principle\n\nFor most people, worship is such a personal thing that we assume it must therefore be subjective. Because worship is a personal encounter with the living God, we think that as long as it feels right, it is right. That is the prevailing notion today.\n\nChristians agree that God must be worshiped, but we disagree over how He is to be worshiped, and the majority conclude that God does not care—He just cares that we worship. People say, \"It's the heart that counts.\"\n\nBut Scripture presents worship as something much more serious and far less flippant than we might think.\n\n> \"Guard your steps as you come into the temple of God.\" (Ecclesiastes 5:1)\n\nIn other words, be careful how you worship because God cares.\n\n**My goal today is not just to prove to you that the RPW is right, but that it is supremely good. I want you to love the regulative principle of worship as a means of loving worship itself.** I will attempt to do this by proving that worship matters and that God cares about our worship through three arguments:\n\n1. The argument from Scripture\n2. The argument from doctrine\n3. The argument from happiness\n\n## First Argument: From Scripture\n\nBecause there are too many passages that promote the RPW to examine in our time, I will focus on one commandment, two stories of brothers, and three New Testament passages.\n\n### The Second Commandment\n\nMany think the First Commandment undergirds the regulative principle, but it is actually the Second Commandment that does so. The First Commandment says you must worship God. The Second Commandment says there is a certain way to do it.\n\n> \"You shall not make for yourself a carved image.\" (Exodus 20:4)\n\nIf God only cared that He was worshiped, not how He was worshiped, He would only give the First Commandment and move to the Third. But He gives the Second Commandment, and it is undergirded by this rationale:\n\n> \"For I the Lord am a jealous God.\" (Exodus 20:5)\n\nHow could we ever claim that God does not care how He is worshiped when He says, \"I have a zeal for My name, for My honor, for My glory. I am jealous for the holiness of My worship\"?\n\nReformed theologians, confessions, and doctrinal statements always use the Second Commandment as a proof text when discussing the RPW. This is even found in the shorter and larger catechisms of Westminster.\n\n### Why This Commandment Matters\n\nThe reason this commandment exists in the first place has to do with the nature of God and the nature of worship. Worship is formative and powerful. It has the ability to instill convictions about God. The way we worship tells us something about the God we worship.\n\nIf we are casual and flippant in how we come to church, the songs we sing, and all the rest, that gives us an impression about God. If we are reverent, sober, and serious, that gives us a different impression about the God we worship.\n\nIf we worship wrongly, we are prone to live and believe wrongly as well. If we have a wrong view of God, that is a terrible method for trying to live in a way that pleases Him.\n\nGod is transcendent—over and above us, outside of this world. He wants to ensure that we never confuse the created with the Creator, never try to capture the Creator with creation. That is why He says: no images, no images.\n\nWhen we break this commandment, we set ourselves on a trajectory where we conclude we can have mastery over God, that we can put Him in a box. Just as we have mastery over wood or stone, or in common parlance, perhaps the pyrotechnics or fog machines we use to get some sense of God being with us.\n\nThis commandment speaks to the sinful impulse we all have to put God in a box and try to control Him, to make Him our puppet. That is the exact opposite of worship. Worship is meant to be a time where we submit to God and do what He says.\n\n**Divine revelation must control our idea of God.** Since worship contributes so greatly to our idea of God, the only way God's revelation can remain foremost in our thinking about Him is if God's revelation controls our worship of Him.\n\nWe want His self-revelation in Scripture to dominate our conception of Him. The Second Commandment helps us with that. We must not try to worship Him according to the way we think, because then we are not worshiping God—we are worshiping ourselves.\n\n### Two Stories of Two Brothers\n\nThere are two stories of two brothers that teach the regulative principle:\n\n**Nadab and Abihu (Leviticus 10)**\n\nAaron's sons, Nadab and Abihu, offered unauthorized fire before the Lord. God did not say, \"Well, at least they meant well.\" No, He struck them dead. God cares how He is worshiped.\n\n**Cain and Abel (Genesis 4)**\n\nThe issue with Cain is not just his heart, but how that manifested. The text says:\n\n> \"God had regard for Abel and his offering, but for Cain and his offering, He had no regard.\"\n\nSome debate what made one offering acceptable and another not. Some say Abel brought an animal while Cain brought a grain offering. We don't necessarily know if that is what the issue is. But the point we are meant to take is that there is a worship that is acceptable to God and there is worship that is not.\n\nThe worship is so intrinsically connected to the worshiper that the text does not say, \"God rejected Cain's offering and accepted Abel's offering.\" It says, \"He accepted Abel and he rejected Cain.\"\n\n**God cares how He is worshiped. Should you?** Yes.\n\n### Three New Testament Passages\n\n**John 4:23-24**\n\nWhen Jesus speaks with the woman at the well, He says:\n\n> \"The hour is coming and is now here when the true worshipers will worship the Father in spirit and truth. For the Father is seeking such people to worship him. God is spirit and those who worship him must worship in spirit and truth.\"\n\nTwo things to notice here:\n\nFirst, this is the only place in all the Bible where God is said to be seeking people to do anything. The only place! And what kind of people is He seeking? **Worshipers.** Do you think God cares how He is worshiped? Absolutely. He is so concerned for His worship that He sent His Son on a mission to redeem people to do it. Not just to do it, but to do it properly.\n\nSecond, Jesus does not only say people must worship God. He says they must worship Him **in spirit and in truth.** There is a right way to worship God and a wrong way to worship Him. The right way is to worship Him in truth.\n\nJesus tells us later in the same Gospel:\n\n> \"Your word is truth.\" (John 17:17)\n\nSo worship according to the Word. That is the regulative principle. Worship according to the Word, and we must worship God also in the power of His Spirit.\n\n**1 Corinthians 14:26-33**\n\nPaul gives instruction for how the gift of speaking in tongues should be used. Some churches say, \"You don't want to regulate worship; we just let the Spirit move.\" But Paul, who is inspired by the Holy Spirit to write this and has the authority of an apostle, is regulating even that kind of worship.\n\nThe worship of the New Testament with speaking in tongues and prophecy does not look anything like Pentecostal churches today. Paul talks about how if there are too many people, you will have to tell someone to wait until next week. That doesn't sound like a pandemonium service where people just need to let it out. No, you sign up on the sheet and next week you can bring your gift.\n\n**Colossians 2:16-23**\n\nThis passage talks about worship devised by men, which has no value in stopping the indulgence of the flesh. We should care how we worship because only right worship has value to us.\n\n## Second Argument: From Doctrine\n\nLet me point out two theological points:\n\n### Consider Who You Are\n\nWhen we consider who we are as fallen creatures, nothing other than the RPW can make sense of how we should come to God in worship.\n\nIf you believe, as good Bible Presbyterians do, in the total depravity of mankind—even your own total depravity—then even your intellect has been affected by sin. If my reason is corrupted by sin, how could my reason instruct me properly in how to approach a holy God?\n\nLikewise, the argument that it is the heart that counts is not really solid. Remember what Jeremiah says about the heart:\n\n> \"The heart is deceitful above all things and desperately sick.\" (Jeremiah 17:9)\n\nWe do not want our twisted heart to guide our encounter with the holy God. Our theology would not allow it. Our theology therefore leads to the regulative principle. We need the sovereign, wise, unerring intellect of God Himself to guide us in worship.\n\nJohn Calvin said this in his tract titled \"The Necessity of Reforming the Church\":\n\n> \"There is a twofold reason why the Lord in condemning and prohibiting fictitious worship requires us to give obedience only to His voice. First, it tends greatly to establish His authority that we do not follow our own pleasure but depend on His sovereignty. But secondly, such is our own folly that if we are left to our liberty, all we are ever able to do is only go astray. And then once we have turned aside from the right path, there is no end to our wanderings until we get buried under a multitude of superstitions. Justly, therefore, does the Lord, in order to assert His full right of dominion, strictly enjoin what He wishes us to do and at once reject human devices. Justly too does He in express terms define our limits that we may not by fabricating perverse modes of worship provoke His anger against us.\"\n\nWe are not only fallen, though; we are also finite. Worship is a time where the creature meets the Creator. Who would have a better grasp for how that conversation should go—the creature or the Creator?\n\nCommon sense or even what theologians call natural law cannot be a sufficient guide for worship because worship is not a natural thing. It is a supernatural thing. Only the divine law revealed from God can inform the minds of men and women with the notions necessary to enter into a supernatural event.\n\nSo the argument from doctrine, specifically in terms of our anthropology, requires the RPW.\n\n### Consider Who God Is\n\nNow we want to think theologically, in terms of the doctrine of God. It would be entirely nonsensical to say that God is sovereign but then go ahead and do whatever we want when we worship Him.\n\nThe way we worship God says something about the way we view God. God is the one who has controlled how He reveals Himself and dictates how He ought to be thought of in our minds.\n\nWhat is the point of worship? **Giving God His glory.** So why are we tempted to think the standard by which we measure if God is glorified is our own personal enjoyment?\n\n\"I really like the worship at this church, so God therefore must be really glorified. I really felt something today, so He must have felt something too.\"\n\nWe need to prefer God's glory to our own preference because the goal of worship is to glorify God.\n\nTerry Johnson says there are only two options in worship: it can be people-centered or it can be God-centered, but it cannot be both. To ensure our worship is God-centered and not people-centered, the single most important thing is to fill our services with biblical content. Services in which the songs, prayers, readings, and sermons are full of Scripture will inevitably be filled with God as well.\n\nThis simply affirms everything we have been saying so far: **God calls the shots in worship.** It makes sense. It would be nonsensical to say God is sovereign and we want God to be glorified and then go do whatever we want.\n\n## Third Argument: From Happiness\n\nThough sin and selfishness box at this notion, **our happiness is bound up with our holiness, and our holiness is bound up with our obedience.**\n\nIn other words, if we want to be happy, we need to obey the Lord's commands, and He knows what will tend to our spiritual good better than we do.\n\nDo we believe that? That is not only a challenge when it comes to going through the trials of life, trusting that God knows best. It is something that challenges us every Lord's Day. When we come into His house, are we ready to come to God on His terms, recognizing that He actually has our good at heart?\n\nThe whole essence of the triune God is bound up with this aim: to bring joy to His people. Do we believe that?\n\nEve did not. Eve doubted that very thing—that God wanted her to be happy. The serpent said, \"Did God really say this? Don't you know life would be better if you broke free from God's regulations and you did things on your own?\"\n\nIn the moment that Eve bought that lie, she forfeited her happiness and ours along with it.\n\nBut Eve was mistaken to think that happiness and submission are incompatible. In fact, the entire Christian faith pushes back against that notion. And so our worship should as well.\n\nThe great theologian Stephen Charnock wrote:\n\n> \"Why are men happy because they cleave to God? Why are men miserable because they recede from God? It is then our own fault that we are miserable. God cannot be charged with any injustice if we be miserable.\"\n\nOne of the most important ways in which we cleave to God and find happiness is in worship—in corporate worship and what we are about to do in just a few minutes.\n\nThat means we cannot do whatever we want. There are limits placed on us. The limits that God gives us—not only in all of life through His law, but also specifically in worship—are meant for our good.\n\nWe think that perhaps the good life comes from removing all the shackles and restrictions and impositions that come in life. We want the ability to do whatever we want. That is what will make us happy. But what if true freedom comes from choosing the right limitations rather than avoiding all limitations?\n\nIt takes faith to believe that. It takes faith to receive the divinely appointed limitation in God's Word with joy, and to approach something as ordinary as Christian worship with anticipation and excitement rather than drudgery.\n\n**God's law is never a cage. Rather, it is a curb. It keeps us on the safe path, the path of satisfaction, the path of fulfillment.**", "id": "Unknown-the-regulative-principle-of-worship", "source_files": ["The Regulative Principle of Worship (Pastor Jonathan Landry Cruze).txt"]};
