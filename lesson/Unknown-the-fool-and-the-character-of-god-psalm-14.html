window.LESSON_DATA = {"title": "The Fool and the Character of God: Psalm 14", "speaker": "Unknown Speaker", "date": "Unknown", "session": "", "series": null, "series_part": null, "parts": 1, "summary": "This lesson examines Psalm 14's portrait of the fool as one who denies God's existence and lives in moral corruption. Through careful analysis of the psalm's language and structure, the speaker demonstrates that all humanity apart from Christ is spiritually foolish and incapable of doing genuine moral good. The lesson concludes with three encouragements from the doctrine of total depravity: believers cannot unsave themselves, salvation is entirely God's work, and God's power guarantees the perseverance of his people.", "outline": [{"title": "The Nature and Practice of the Fool", "subpoints": ["The fool denies God's existence in his heart to avoid conviction of conscience", "The scriptural fool is always contrasted with the wise and differs from the simple", "The fool's sin is more heinous because it is sin against knowledge", "The fool is described by what he does, not who he is, because the practical atheist is the only atheist that exists", "The fool is corrupt and disfigured, not functioning as God created humanity to function"], "scripture": ["Psalm 14:1", "Proverbs 15:5", "Proverbs 4:23", "Proverbs 23:7", "Romans 1:20-23"]}, {"title": "God's Judgment: The Universal Condition of Mankind", "subpoints": ["God looks down from heaven in judgment to see if anyone understands or seeks him", "All children of man apart from Christ have turned aside and become corrupt", "No one naturally seeks God; there is no such thing as an existential atheist by nature", "All humanity apart from grace lives as if there is no God", "There is no innate goodness in humanity; total depravity affects all aspects of being"], "scripture": ["Psalm 14:2-3", "Psalm 63:1", "Genesis 6:5", "Genesis 11:5", "Genesis 19:1", "Proverbs 21:4", "Romans 3:10-12"]}, {"title": "The Problem: Humanity's Inability to Seek God", "subpoints": ["The problem with making the church seeker-friendly is that no one seeks the true God by nature", "Attempting to make church like the world attracts people to the world, not to Christ", "Whatever attracts people is what they will be attracted to", "The fall caused all to depart from God and reject him", "The doctrine of total depravity means man is incapable of doing moral good in God's sight"], "scripture": ["Psalm 14:3", "Romans 3:9-12"]}, {"title": "The Solution: Salvation Must Come from Outside", "subpoints": ["Salvation must come from Zion, from outside of humanity, because we cannot turn to God ourselves", "God's righteousness is revealed through faith in Jesus Christ", "Salvation is entirely God's work through grace and redemption in Christ", "Jesus is the propitiation for sin through his blood", "God saves; his name in Hebrew is Yahweh, which means 'the Lord saves'"], "scripture": ["Psalm 14:7", "Romans 3:21-25"]}, {"title": "Three Encouragements from Total Depravity", "subpoints": ["We are powerless to save ourselves, but we are also powerless to unsave ourselves because God keeps us in his hands", "Since we cannot save ourselves, salvation must be entirely God's work through his Spirit", "Since God is all-powerful, never changes, and has promised to save his people, we are in the best possible situation", "God's promise ensures that all the Father gives to the Son will come to him and will not be cast out"], "scripture": ["John 6:37", "Romans 8:39"]}, {"title": "The Textual Note on Psalm 14:1", "subpoints": ["Verse one uses a singular noun and verb (the fool) but then shifts to plural verbs (they are corrupt)", "The word fool is a collective noun referring to all fools, not just one individual", "This grammatical transition demonstrates David's movement from particular to universal application", "Psalm 14 is nearly identical to Psalm 53 except for verse 7, which was likely added during or after the Babylonian captivity"], "scripture": ["Psalm 14:1", "Psalm 53"]}], "tags": [{"tag": "The Fool", "source": "detected"}, {"tag": "Total Depravity", "source": "detected"}, {"tag": "God's Salvation", "source": "detected"}, {"tag": "Atheism", "source": "detected"}, {"tag": "God's Grace", "source": "detected"}, {"tag": "Psalm Interpretation", "source": "detected"}], "scripture_references": [{"reference": "Psalm 14", "type": "quoted", "source": "detected"}, {"reference": "Psalm 14:1", "type": "quoted", "source": "detected"}, {"reference": "Psalm 14:2-3", "type": "quoted", "source": "detected"}, {"reference": "Psalm 14:7", "type": "quoted", "source": "detected"}, {"reference": "Psalm 19:7", "type": "referenced", "source": "detected"}, {"reference": "Proverbs 15:5", "type": "referenced", "source": "detected"}, {"reference": "Proverbs 4:23", "type": "referenced", "source": "detected"}, {"reference": "Proverbs 23:7", "type": "referenced", "source": "detected"}, {"reference": "Romans 1:20-23", "type": "quoted", "source": "detected"}, {"reference": "Psalm 63:1", "type": "referenced", "source": "detected"}, {"reference": "Genesis 6:5", "type": "referenced", "source": "detected"}, {"reference": "Genesis 11:5", "type": "referenced", "source": "detected"}, {"reference": "Proverbs 21:4", "type": "referenced", "source": "detected"}, {"reference": "Romans 3:10-12", "type": "referenced", "source": "detected"}, {"reference": "Romans 3:21-25", "type": "quoted", "source": "detected"}, {"reference": "Psalm 53", "type": "referenced", "source": "detected"}, {"reference": "John 6:37", "type": "referenced", "source": "detected"}, {"reference": "Romans 8:39", "type": "referenced", "source": "detected"}, {"reference": "Isaiah 64:6", "type": "referenced", "source": "detected"}], "transcript": "## Reading of Psalm 14\n\n> To the chief musician, a Psalm of David, the fool has said in his heart, there is no God. They are corrupt, they have done abominable works, there is none who does good. The Lord looks down from heaven upon the children of man to see if there are any who understand, who seek God, they have all turned aside, they have together become corrupt, there's none who does good, no not one. Have all the workers of iniquity no knowledge who eat up the people as they eat bread and do not call on the Lord? There they are in great fear for God is with the generation of the righteous. You shame the counsel of the poor but the Lord is his refuge. Oh that the salvation of Israel would come out of Zion when the Lord brings back the captivity of his people that Jacob rejoiced and Israel be glad. (Psalm 14)\n\n## Introduction and Context\n\nExcept with minor differences, Psalm 14 is the same as Psalm 53. It is a Psalm of David but verse 7 if you notice is something that's after David's time was added later on by the inspiration of the Spirit either during or after the Babylonian captivity. As with so many of David's psalms we can't really tell when and why it was written, it doesn't trace an event of David's life. Perhaps this is just David's musings as he's thought about what it means to be a fool and to not follow the Lord.\n\n## The Nature of the Fool\n\n### Definition and Contrast\n\nWhat you see here is a description of the fool. In verse 1 David says, the fool says in his heart there is no God. The scriptural fool is always cast in contrast with the wise. The fool is the wicked sinner while the wise is the redeemed righteous. There's also a great difference between the fool and the simple in the Bible. The simple is the ignorant, the one who needs to be instructed in the Word of God.\n\nRemember what Psalm 19 says in verse 7:\n\n> The law of the Lord is perfect converting the soul, the testimony of the Lord is sure, making wise the simple. (Psalm 19:7)\n\nSo the simple is the uninstructed, is the ignorant, the one that doesn't know. The fool is the one who has been instructed in the Word of God and does not live according to it. An example of that in the book of Proverbs is Proverbs 15 verse 5 where it says:\n\n> A fool despises his father's instruction. (Proverbs 15:5)\n\n### Sin Against Knowledge\n\nWhen the simple sins, there's a difference between the sin of the simple and the sin of the fool. When the simple and the fool transgress or don't conform to the law of God, they both sin. However, the sin of the fool is much more heinous, much worse than the sin of the simple because it is sin against knowledge.\n\n### The Heart Level of Foolishness\n\nThe fool lives as if there is no God according to David. He or she continually says in his or her heart that there is no God and does that in order to convince herself that there isn't a God so that her conscience won't bother her. He does that at the heart level because the heart controls everything in life. As Proverbs says:\n\n> Keep your heart with all diligence because out of it flows all the issues of life. (Proverbs 4:23)\n\nThe fool teaches us the importance of guarding our hearts by being very careful about how we think and what we think. Proverbs says:\n\n> For as he thinks in his heart so is he. (Proverbs 23:7)\n\nIt is important for us to notice that David describes the atheistic fool in terms of what he does. Do you notice that? The fool does this and this not in terms of who he is and there's a reason for that. David does that because the practical atheist is the only atheist that exists. There's no such thing as one who in his heart or her heart is an atheist.\n\n### The Nature of All People\n\nThe Bible tells us that according to the scriptures, everyone knows that there is a God but some choose to live as if that God didn't exist. In Romans 1 verses 20 to 23 the apostle Paul says:\n\n> For since the creation of the world his invisible attributes are clearly seen. His character is and he, Paul says that it's clearly seen from the very beginning of the world. It's clearly seen being understood by the things that are made even his eternal power and God had so that they are without excuse. Why? Why is everyone without excuse? Because although they knew God, everyone who sees creation, everyone who experiences creation, they see God. There's no such thing as an existential, by nature who is an atheist. Because although they knew God, they did not glorify him as God nor were thankful but became futile in their thoughts and their foolish hearts were darkened. (Romans 1:20-23)\n\nThey weren't fools because their heart was darkened. Their heart was darkened because they were fools in denying that there is a God.\n\n### The Corruption of the Fool\n\nDavid describes the practice of the fool. Now notice in verse one, he says, the fool has said in his heart, singular, but then he continues and goes on to plural verbs: there is no God, they are corrupt, they have done abominable works, there is none who does good. David goes from a singular noun and verb in the first line of verse one to plural nouns and verbs in the rest of the verse because the word fool in verse one is a collective word. It includes all the fools. He's not just thinking of that one guy. He's talking about the entirety of humanity apart from Christ that denies the existence of God.\n\nHe says the fool is corrupt and the idea here is that the fool is depraved or disfigured. To use an illustration, because those things exist—have you ever been to those halls of mirrors where you walk in and you are too short, too skinny, too fat, too wide, too crooked? That's the fool: a disfigurement of the design of God. It's one who is not functioning as God created him to function because all of you were created to know God and to glorify him and to enjoy him in that process. And yet the fool who says there is no God has been disfigured, it has been corrupted, it has twisted.\n\nSo it shows that the state of foolishness is not what God designed for us. It is a corruption of what God intended. David says that the fool has committed vile deeds, deeds that are contrary to the law of God and these deeds are described in the book of Proverbs. If you go and look at the book of Proverbs and maybe if you have a Bible software that you can search for words and just search for fool, you're going to find verse after verse that talks about the fool and you can very truly, truthfully replace the word fool with the word sinner and the meaning of the passages won't change because that's really what the fool is—the sinner.\n\nDavid tells us that the fool is incapable of doing good, any moral good. And this is the thing: anyone who lives as if there is no God is incapable of doing moral good. And you protest, that's not true. I know unbelievers who do good, they feed the poor and so on. And yet Isaiah tells us that the best of our acts, the best of our righteousness, is nothing more than dirty rags before the eyes of God because it's tainted by sin.\n\nBrothers and sisters, the supreme good is trusting God. And if you don't have that, then everything that comes from you is not morally good.\n\n## God's Judgment and the Universal Condition\n\n### God Looks Down from Heaven\n\nIn verses two and three, the Lord declares that every child of man is a fool by nature. Look at verse two:\n\n> The Lord looks down from heaven upon the children of man to see if there are any who understand, who seek God, they have all turned aside, they have together become corrupt, there's none who does good, no, not one. (Psalm 14:2-3)\n\nHere God changes the perspective from the particular, the fool, to the universal: the fools or the children of man, because he says both are the same. Anyone apart from Christ is the fool of Psalm 14 because any belief that is a belief not in the God of the Bible is an atheistic belief because there's no other God. And if you're not trusting in that God, the God of the Bible, you're not trusting in any God at all. And therefore you are an atheist who says in his heart, there is no God, which the Bible calls the fool.\n\n### The Judgment Context\n\nThe translation does a good job when it renders the first Hebrew verb in verse two with the present tense English verb \"looks.\" The Lord looks down from heaven. This is technically a past tense, but in context it works as a present tense. The looking on God's part is not something he did once and that was it. But God is perennially, always looking down to see if there's any who do good. It's a constant quest as it were of God to find that one person who is seeking him, who is seeking to do what is good.\n\nNow, every time that God looks down from heaven, it's not because there's a good thing going on. There are only three other times in the Bible where this expression is used where God looked down from heaven. And that wasn't because he was seeing some good stuff that God says he looked down from heaven.\n\nThe first is the flood. In Genesis 6, when God looked down from heaven, he saw that the intents of man's heart were continually evil.\n\nThe second is the Tower of Babel. He says he looked down. Man says, oh, we're going to build a building that's going to go all the way up to heaven. Oh, we're so good. We're so ingenious. It's great. We're going to build this tower on our own. We're going to reach heaven. We're going to go to God independently of God. And God says, oh, let me just look down. Look down there. That tiny little tower down there. They were supposed to come and reach to the heavens.\n\nAnd then the third time that God came and looked down was in Sodom and Gomorrah, where God looks down and he sees there. This indicates that God is going to judge the fool. When he looks down, man is looking down in judgment.\n\nThis anthropomorphic representation of God with the human characteristics of looking down teaches us two things that God is looking for in the children of man. Look at verse 2 again:\n\n> The Lord looks down from heaven upon the children of man to see if there are any who understand, who seek God. (Psalm 14:2)\n\nHe's looking for any who understand. That's the first thing that he does. What is the object of understanding? What is it that God is trying to find somebody understanding? What is it that he wants them to understand? I think the answer is the law of God. The man who understands is the wise man because he lives according to his knowledge. God wants us, the children of man, to be wise people.\n\nAnd the second thing is looking to see if there's any who seeks after him. Now to seek God is to pursue, to know, to rely on him like the Psalmist in Psalm 63 where he says:\n\n> Oh God, you are my God. Early I will seek you, my soul thirsts for you, my flesh longs for you in a dry and thirsty land where there is no water. (Psalm 63:1)\n\nGod is looking down and seeking for people who are doing that kind of seeking after him. God wants us children of man to seek after him. And yet the Psalmist says that he did not find any of that. In verse three, they all have turned aside, they have together become corrupt. There is none who does good. No, not one.\n\n### The Universal Scope\n\nAs God looks down at the children of man, he does not find any who understand or seek him. And notice now the scope is extended, expanded. It is not only the fool that lives as if there is no God, it is also all apart from the grace of God who lives as if there is no God. If a person lives not according to God's word, they are living as if there is no God. If you live apart from obedience to God, you are living no matter what you claim, you're living as if there is no God.\n\nAnd notice also that God does not find anyone who is seeking him. That's the sad conclusion of this verse. They find none. This statement has tremendous implications for how we deal with unbelievers. We cannot make our goal to make everything in church seeker friendly because no one seeks the true God. What ends up happening when this is our attempt is that we end up making the church just like the world so that the world can feel comfortable in it. The problem is that the church stinks being like the world. Whatever we attract people with, that's what we attract them to. And if we want to give them what they're seeking, that is not going to be Jesus Christ, the Savior, the forgiver of their sins.\n\nAll the children of man have turned aside, David says in verse three, or have literally departed, and this happened at the fall. And this is true of everyone of us since then. Did you get that there's not one soul in this world who is seeking God? We all love Augustine's statement. We know, Augustine says that nobody's ever read Augustine except for that one line that says our hearts are restless, they'll find rest in you. But it also says that God made us with a God-shaped hole in our hearts and needs to be filled. And there's truth in that, but we're not seeking to fill that hole with God. We're not seeking naturally to be finding rest in God. We already know that he exists and we've rejected him in our existence.\n\nAnd then David says that all the children of man have become morally corrupt. There isn't any innate goodness in humanity. There's no spark of the divinity in any of us. We are not good. Did you get that? We are not good. There isn't one person on the face of the earth who does good, apart from the Lord Jesus Christ.\n\nAs an example of that in Proverbs 21:4, the Holy Spirit says this:\n\n> A proud heart and even the plowing, which is a good thing, right? Plowing the land, even the plowing of the wicked is sin. (Proverbs 21:4)\n\nAnd this is a doctrine commonly called the total depravity or the total inability of man. Man is corrupt in every aspect of his being and incapable of doing what is morally good in the sight of God. And Paul quoted verses one through three in Romans 3 to prove that all of humanity lies under sin and is therefore subject to the punishment due to it.\n\n## The Counsel of Salvation\n\n### Salvation Must Come from Outside\n\nThat's where you are apart from Christ. That's where all of humanity is apart from Christ. But verse 7 provides hope. There is salvation that comes from Zion. In verse 7, the Holy Spirit says:\n\n> Oh that the salvation of Israel would come out of Zion when the Lord brings back the captivity of his people. Let Jacob rejoice and Israel be glad. (Psalm 14:7)\n\nThe children of man, namely us, cannot turn to God on our own. So salvation must come from Zion, that is, from outside of us. Who lives in Zion? Jesus is good, right? Jesus, God is in Zion. Zion is his holy hill. And what David is saying is that salvation must come from outside of us. Salvation must come from God.\n\n### The Righteousness of God Through Christ\n\nThis is what Paul argues in Romans 3, where in verses 21 through 25 he says:\n\n> Now the righteousness of God, apart from the law, is revealed, being witnessed by the law and the prophets, even the righteousness of God, through faith in Jesus Christ, to all and on all who believe. For there's no difference. For all have sinned and fall short of the glory of God, being justified freely by his grace through the redemption that is in Christ Jesus, whom God set forth as a propitiation by his blood through faith, to demonstrate his righteousness, because in his forbearance God had passed over the sins that were previously committed. (Romans 3:21-25)\n\nGod saves. Do you get that? God saves. Do you know what whose name that is in the Bible? Jesus. Yahweh saves. God saves. This doctrine of the total depravity of man is a biblical one, taken out of Psalm 14.\n\n## Encouragements from Total Depravity\n\n### A Seemingly Discouraging Doctrine\n\nAnd he may seem discouraging. He might say, man, I stayed for a warm Sunday afternoon just for him to tell me that I'm bad and not in a good way. Because it can be bad in a good way, but this is bad in a bad way. But if you stop and think, this is an encouraging doctrine when you give a little thought to it. Let me give you three encouragements from this doctrine.\n\n### First Encouragement: We Cannot Unsave Ourselves\n\nThe first one is this: We are powerless to save ourselves. I said, wait a minute, I thought you're still going to encourage us. We are powerless to save ourselves, but we also are powerless to unsave ourselves. The God who saves also causes you to persevere, because there's nothing, absolutely nothing that can separate you from the love of God in Jesus Christ. Do you get that, brother, sister? The same God that turned your heart to him is the God who keeps that heart in his hands.\n\n### Second Encouragement: Salvation Is God's Work\n\nSecondly, since we are completely unable to save ourselves, salvation must entirely be the work of God. He must call us to himself by his Spirit. And brothers and sisters, he does just that. Do you need evidence of that? You're here. You're a believer in Jesus Christ. He calls you to him. And if, especially if you are saved from outside of the church, you know that it took God to save you. It wasn't because you're such a great person and whatever. More than likely you're running the opposite direction and God caused you to come to him.\n\n### Third Encouragement: God's Power and Promise\n\nAnd thirdly, since it is all the work of God, and God is all powerful and does what he wants. And he never changes. And he has promised to save his people. We are in the best situation we could be in. We can't do anything to save ourselves, but God can and he will. And he said that all that the Father has given to the Son will come to the Son. And the Son will in no way cast them out.\n\n> All that the Father has given to the Son will come to the Son. And the Son will in no way cast them out. (John 6:37)\n\nSo praise the Lord for his grace that saves people like us. And with Paul, all of us can say that we're the chief of sinners. And yet God saves even the chiefest of sinners.", "id": "Unknown-the-fool-and-the-character-of-god-psalm-14", "source_files": ["The Psalms.txt"]};
</script>
