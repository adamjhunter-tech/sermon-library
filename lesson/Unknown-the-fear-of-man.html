window.LESSON_DATA = {"title": "The Fear of Man", "speaker": "Unknown Speaker", "date": "Unknown", "session": "", "series": null, "series_part": null, "parts": 1, "summary": "This lesson examines the biblical concept of the fear of man as a moral fear that controls behavior contrary to God's will. It explores how the fear of man manifests in various forms such as people-pleasing and perfectionism, contrasts it with the proper fear of God, and demonstrates why fearing man leads to spiritual bondage while fearing God brings freedom.", "outline": [{"title": "What Is the Fear of Man?", "subpoints": ["A moral fear that keeps people from doing what is right or encourages them to do what is wrong", "Distinct from natural fear of physical danger like poisonous snakes or weapons", "Originates from the heart as a controlling force contrary to allegiance to God", "Jesus contrasts it with the proper fear of God in Matthew 10:28"], "scripture": ["Proverbs 29:25", "Matthew 10:28"]}, {"title": "Biblical Examples of Fearing Man", "subpoints": ["Abraham feared man more than God multiple times, including lying about Sarah in Egypt", "Isaac repeated his father's pattern of fearing man", "Secret disciples in John 12 refused to confess Christ for fear of losing synagogue status and human praise", "The one-talent servant buried his talent out of fear of his master"], "scripture": ["Genesis 12:10-13", "John 12:42-43", "Hebrews 11"]}, {"title": "How the Fear of Man Manifests", "subpoints": ["Peer pressure and people-pleasing behaviors", "Perfectionism rooted in fear of being thought poorly of", "Low self-esteem based on others' opinions", "Body image issues and anxiety", "Marriage problems from undue concern for parents' opinions", "Unwillingness to share the gospel or defend biblical doctrines", "Attempting to keep up appearances on social media"], "scripture": []}, {"title": "The Fear of Man as Idolatry", "subpoints": ["All manifestations of fear of man fall under the category of sin", "The ultimate category is idolatry—self-worship is the god being served", "Fearing man is the opposite of fearing God", "Attempting to serve both simultaneously is trying to serve two masters, which is impossible"], "scripture": ["Matthew 6:24"]}, {"title": "The Fear of Man Brings Bondage", "subpoints": ["The fear of man is a snare—a hidden trap that catches people unaware", "Those who fear man become enslaved to the people they fear", "All humans have addictive personalities and are slaves to either sin or righteousness", "Fearing man means becoming a slave to sin leading to death", "Those who overcome us become our masters"], "scripture": ["Romans 6:16", "Romans 6:18", "2 Peter 2:19", "1 Corinthians 7:23"]}, {"title": "The Fear of God Brings Freedom", "subpoints": ["The proper fear of God is the opposite of the fear of man", "Godly fear is the reality of faith in God through Jesus Christ", "God has given us a spirit of power, love, and a sound mind, not fear", "As we fear God, we are freed to love people rather than fear them", "We are bought at a price and should not become slaves to man"], "scripture": ["2 Timothy 1:7", "1 Corinthians 7:23"]}, {"title": "God's Love Versus Pop Psychology", "subpoints": ["Pop psychology teaches that we must love ourselves first to love others", "The Bible teaches that we must love God first, then we can love others", "The greatest command is to love God with all your being", "The second command, like the first, is to love your neighbor as yourself", "Without proper fear and love of God, we cannot truly love others"], "scripture": []}], "tags": [{"tag": "Fear of Man", "source": "detected"}, {"tag": "Idolatry", "source": "detected"}, {"tag": "Fear of God", "source": "detected"}, {"tag": "People-Pleasing", "source": "detected"}, {"tag": "Spiritual Bondage", "source": "detected"}, {"tag": "Christian Freedom", "source": "detected"}], "scripture_references": [{"reference": "Proverbs 29:25", "type": "quoted", "source": "detected"}, {"reference": "Matthew 10:28", "type": "quoted", "source": "detected"}, {"reference": "Hebrews 11", "type": "referenced", "source": "detected"}, {"reference": "Genesis 12:10-13", "type": "referenced", "source": "detected"}, {"reference": "John 8", "type": "referenced", "source": "detected"}, {"reference": "John 12:42-43", "type": "quoted", "source": "detected"}, {"reference": "Matthew 6:24", "type": "referenced", "source": "detected"}, {"reference": "Romans 6:16", "type": "quoted", "source": "detected"}, {"reference": "Romans 6:18", "type": "referenced", "source": "detected"}, {"reference": "2 Peter 2:19", "type": "quoted", "source": "detected"}, {"reference": "1 Corinthians 7:23", "type": "quoted", "source": "detected"}, {"reference": "2 Timothy 1:7", "type": "quoted", "source": "detected"}, {"reference": "Romans 4", "type": "referenced", "source": "detected"}], "transcript": "## The Fear of Man\n\n### Scripture Reading\n\n> \"The fear of man brings a snare, but whoever trusts in the Lord shall be safe.\" (Proverbs 29:25)\n\nOur verse says the fear of man brings us a snare, but whoever trusts in the Lord shall be saved. The fear of man can be a powerful, controlling factor in our lives.\n\n### Defining the Fear of Man\n\nI wanted to consider what the fear of man is, what qualifies as the fear of man, and what the Lord says about repenting from the fear of man and embracing the fear of God.\n\nThe fear of man is a moral fear that keeps a person from doing what is right, or encourages a person to do what is wrong. It's important to emphasize that it is a moral idea—a moral fear. The fear of man is not the same as being afraid of a poisonous snake that is about to pounce on you, or being afraid of a person with a gun to your head. We should be afraid of those things. The fear of man is a moral controlling force upon us that comes from our hearts that is other than allegiance to God.\n\nJesus says that the fear of man must give way to the fear of God. In Matthew chapter 10, verse 28, the Lord says:\n\n> \"Do not fear those who kill the body, but cannot kill the soul, but rather fear Him who is able to destroy both soul and body in hell.\" (Matthew 10:28)\n\nHere the Lord says that the fear of man—that which just has to do with this life, this body—don't worry about that. That's not who you should fear. You fear the one who can deal with your body and your soul.\n\n### Biblical Examples: Heroes of Faith Who Feared Man\n\nThe Bible is different than any other religious book because it tells us that all our heroes are flawed people. Hebrews 11 is the hall of faith. You have all the lists of those whose faith we are supposed to imitate, and you start reading them. It starts with Adam and Eve and Seth and Noah and Abraham and Isaac and Jacob and Moses, and you see their lives and they all had flaws. One of the things that often was present with them was that they feared man more than they feared God.\n\n#### Abraham the Father of the Faithful\n\nFor example, Abraham, who is called the father of the faithful, is the one whose faith in Romans 4 we are to imitate. He had justifying faith. He believed in the Lord Jesus Christ and the Messiah to come. Jesus says in John 8 that Abraham saw My day and rejoiced in it. So that's who Abraham is.\n\nAnd yet we read several times in the book of Genesis where he feared man more than he feared God. One example is Genesis 12, verses 10 through 13, where there is a famine in the land. Abram took his wife, Sarah, to Egypt, and she was a very beautiful woman. He was afraid that if the people knew that she was his wife, they would kill him in order to have her. So he told her to tell them that she was his sister—a half truth because she was his half sister. By doing that, he spared his own life but put her life in jeopardy and sinned against the name of the Lord. Interestingly, the Egyptian ruler actually had more of a sense of what is right than Abraham did at the time, even though he was an unbeliever. Abraham did that several times. Why? Because he feared men. That moral control of something other than God dictating what you are going to do.\n\nGuess who also did that? Yes, Isaac did that—like father, like son.\n\n#### Secret Disciples\n\nWe have other examples. In the book of John, the Gospel of John chapter 12 speaks of secret disciples. In John 12:42-43, it says:\n\n> \"Nevertheless, even among the rulers, many believed in Him, but because of the Pharisees they did not confess Him, lest they should be put out of the synagogue, for they loved the praise of men more than the praise of God.\" (John 12:42-43)\n\nWhy did they keep their faith secret? Because they wanted to be praised by men about being very good members of the synagogue more than they wanted the praises of God for believing the Lord Jesus Christ.\n\n#### The One-Talent Servant\n\nWe see also that in the parable of the talents in the portrait of the judgment of the last day, the one-talent man says that he did what he did because he feared the man. Now he didn't fear him because he was the Lord Jesus Christ. He feared him just because he had some reputation. Because he feared him as a man, he buried the one talent, did nothing with it, and was denied entrance into paradise because of that.\n\n### Manifestations of the Fear of Man\n\nHow else can we call the fear of man? What other terms can we give to this idea? It shows itself as pressure, pride, people-pleasing, shyness, performance anxiety. You could see it in double-tongued speech, when you say what might please them rather than the truth. Peer pressure, people-pleasing—these are all ideas of the fear of man.\n\nWhat is the ultimate biblical category that all of this falls under? It is sin. And Jesus is the answer for sin. What is the specific, broad sin that this all falls under? Idolatry. And who is the idol? Who is the god? Self. The fear of man is ultimate self-worship.\n\n#### Other Issues Rooted in the Fear of Man\n\nOther issues that may have the fear of man at their root include perfectionism. Some people say, \"I'm not going to do it unless I can do it perfectly.\" The root of that can be the issue of the fear of man because you are so worried about what people are going to think about what you do that you prefer not doing it than failing at it or not being thought well of for it.\n\nThere was a kid who was a principal and he was a really fast runner, but he would lose races on purpose. He would not give his all in races because it seemed like he was so afraid that he might lose that he would prefer losing and have an excuse for it. There was a better thought in his mind than just straight out losing. Right? So being the potential winner for him was better than being the actual winner because he was afraid that if he gave his all and if he didn't win, people would think very lowly of him.\n\nSo-called low self-esteem can also be something that is rooted in the fear of man because we put so much credit in what other people think of us, and not getting what we think we should get, we start getting down.\n\nOften, body image issues can be rooted for the same reasons on the fear of man. Anxiety can be often based on the fear of man. Marriage issues—what I mean by that is sometimes there is such an undue concern for the opinions of parents that the marriage gets affected by it. There is a failure to leave and cleave there.\n\nThese are issues whose roots can be in the fear of man. You're afraid to insult someone, and then what don't you do? You don't tell the truth because you are too afraid that that might hurt them.\n\nWhere else might the fear of man show up in practice? Being afraid to share the gospel—exactly, because you are afraid that they are going to think that you are a fool or something like that, so you don't share the gospel. Betrayal of doctrines that the world looks down on, like creationism? Because they might think that you are a Bible thumper, that you don't believe in science. Right? You are not a scientist. But I believe in science. What other ways might this show up?\n\nIt might show itself in working yourself to the bone so that you can have the resources to keep up with the Joneses because you want people to think well of you. It might show itself in your Instagram account where you say, \"Oh, I just woke up that way,\" and put a picture that took three hours to produce so that you could look that way for that picture. These are all manifestations of the fear of man.\n\nNot answering questions in the afternoon service because you might be wrong and you are afraid to share that. That is true.\n\n### The Danger of the Fear of Man\n\nIt is a dangerous thing to fear men. It is a dangerous thing because fearing man is the opposite of fearing God. And that in itself can be a hell-leading belief. Again, Lord Jesus says in Matthew 10:28:\n\n> \"Do not fear those who kill the body but cannot kill the soul, but rather fear Him who is able to destroy both soul and body and hell.\" (Matthew 10:28)\n\nDo you see how there is either this or that? That is how Jesus puts it. Trying to juggle fearing man and fearing God at the same time is trying to serve two masters. We always struggle with that, and I think the younger you are, that tends to be more of a struggle. Think of myself in middle school and high school. That was a big struggle—thinking of what other people thought of me was more important than anything else. I think sometimes even younger people might sacrifice relationships because somehow being a friend with this person would be thought lower by that person. So I am going to please this person so I am not going to be a friend with this person.\n\nYoung brothers and sisters, if you follow what the Lord Jesus says, this is an attitude that can lead you to hell. That is how serious this is, and we have to be careful with that. It is an attempt to try to serve two masters, which the Lord Jesus Christ says is not possible in Matthew 6:24.\n\n### Pop Psychology Versus Biblical Truth\n\nWhat is the prevalent pop psychology view about love? In order to love others, what do you have to do first? What do you have to learn to do first? Love yourself. You all should give yourself a hug right now because that is what you need, right?\n\nThere is disagreement in the body. Some thought it was disgusting. The prevailing pop psychology is that we cannot love others until we learn to love ourselves. But the Bible says that we cannot love others until we love God properly. That is really where it begins, right? The greatest command is to love God with every ounce of your being. The second is like unto it—love others, love your neighbor as yourself. Start with love for God, not love for self, but love for God.\n\nThat is why the fear of God needs to be present because if you fear man, we are not loving God, and we are therefore not able to love others either.\n\n### The Fear of Man as a Snare\n\nIt is important we get this: the fear of man is not an insignificant misunderstanding. It is not just a little thing. It is not just a mistake. It is a destructive sin. Again, verse 25 says:\n\n> \"The fear of man brings a snare.\" (Proverbs 29:25)\n\nWhat is a snare? In this context, it is a trap, right? And a trap is usually hidden. You do not notice it. Otherwise, you deserve to be caught in it, right? If you see it. A trap is usually attractive. There was a dessert today—it was a truffle. Whoever brought that, it was really good with banana and cream and everything in it. But that would never be a snare for some people because it is not attractive for them. The power of the trap is that one can fall into it without noticing it. And that is the danger of the fear of man. We can fall into it without noticing. The fear of man is a temptation we need to be always aware of because we might fall into it without noticing. And it is designed to do that just for us. So we need to be continually looking into our hearts to see if we are falling into that.\n\nBrothers and sisters, the fear of man is not safe. You look again in verse 25:\n\n> \"The fear of man brings a snare, but whoever trusts in the Lord shall be safe.\" (Proverbs 29:25)\n\nThe opposite of the fear of man is safety. That leads us to conclude that the fear of man is not safe. And notice that in the second half of verse 25, the fear of man is contrasted with trusting God. Trust in the Lord is the opposite of fear of man. This is reality.\n\n### The Fear of Man Brings Bondage\n\nInordinate people-pleasing, inordinate fear of man, brings you into bondage by enslaving you to everyone whom you desire to please. If you are fearing somebody as this verse says, you are giving that person control of your life. They control you.\n\nIt is popular to speak of addictive behavior and addictive personality as if only some people had that. The Bible teaches that we all have that. We all have addictive personalities. We see that in Romans 6:16 and 6:18:\n\n> \"Do you not know that to whom you present yourselves slaves to obey, you are the ones slaves whom you obey, whether of sin leading to death or of obedience leading to righteousness? But God be thanked that though you were slaves of sin, yet you obeyed from the heart that form of doctrine to which you were delivered. And having been set free from sin, you became slaves of righteousness.\" (Romans 6:16, 6:18)\n\nWe all have addictive personalities. We are either going to be addicted to sin or to righteousness because addiction is enslavement. We all have that enslaved personality. We are going to be slaves to sin or slaves to righteousness. We are either going to be obedient to sin and as a result become its slave and experience death, or we are going to be obedient to righteousness and as a result become its slave and experience life. We only have two choices: slavery to sin, which produces bondage, or slavery to righteousness, which produces freedom.\n\nThe fear of man is slavery to sin. So again, young people, if you think I am not going to be a friend of this person because I want to please this person, what you are actually saying is that I want to be a slave to sin that leads to death. That is really what you are saying at that point.\n\nPeter uses different language to describe the same thing. In 2 Peter 2:19, he says:\n\n> \"While they promise them liberty, they themselves are slaves of corruption. For by whom a person is overcome, by him also he is brought into bondage.\" (2 Peter 2:19)\n\nIt is interesting he says \"by whom,\" not \"by what.\" By whom a person is overcome, by him also he is brought into bondage. So whoever you overcome, whoever you fear, that is going to be your master. Is there going to be a person in your life, or are you going to be the Lord Jesus Christ?\n\nWhen we overcome by our desire to please people—which is in actuality a desire to be thought well of by people—we become slaves to the very people we are trying to please. Every person we try to please in order to be thought well of or to get something from them becomes our captain and our conqueror.\n\nYet in Jesus Christ we have been freed from this and any other slavery to the world, to the flesh, and to the devil. In 1 Corinthians 7:23, Paul clearly says:\n\n> \"You were bought at a price; do not become slaves of man.\" (1 Corinthians 7:23)\n\nFearing man, being slave to man, is actually to act contrary to what you have been made in Jesus Christ. Let us not do that.\n\n### The Fear of God Brings Freedom\n\nNow God calls us to fear Him with a fear that brings freedom. Godly fear is the reality of faith in God through Jesus Christ and treasuring Christ above all else. The apostle Paul told Timothy, who struggled with the fear of man. Timothy was timid and he struggled with the fear of man. This is why he tells him:\n\n> \"God has not given us a spirit of fear but of power and of love and of a sound mind.\" (2 Timothy 1:7)\n\nThat is the same spirit that you and I have in Jesus Christ. So instead of fearing man, we live according to who we are in Christ. The spirit lives in us, and we fear God. And as we do that, then we are able to love people instead of fearing them.", "id": "Unknown-the-fear-of-man", "source_files": ["Proverbs 29-25- The Fear of Man (Pastor Tito Lyro).txt"]};
</script>
