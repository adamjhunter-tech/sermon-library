window.LESSON_DATA = {"title": "The Memorable Name of God: Yahweh (Hosea 12:5)", "speaker": "Pastor Tito Lyro", "date": "Unknown", "session": "", "series": null, "series_part": null, "parts": 1, "summary": "This sermon explores the meaning and significance of God's name, Yahweh, as revealed in Hosea 12:5. Pastor Lyro examines what it means that God's name is 'He is'—emphasizing God's self-existence, unchangeability, faithfulness, and ultimate revelation through Jesus Christ. The message traces how this name encompasses all of God's attributes and calls believers to honor and glorify His name through worship and obedience.", "outline": [{"title": "What's in a Name: The Importance of Names", "subpoints": ["Names used to carry significant meaning in ancient times", "When a name belongs to God, it contains everything about His identity", "God's personal name is Yahweh, not merely a title"], "scripture": ["Hosea 12:5", "Exodus 3:14"]}, {"title": "God's Name Means 'He Is': What This Reveals About God", "subpoints": ["Yahweh literally means 'He is'—God is eternally present", "God's name reveals His unchangeableness and constancy", "Unlike the gods of the nations, the true God does not change His expectations", "God's name shows He is self-existing and has no needs"], "scripture": ["Exodus 3:14", "Acts 17:28", "Philippians 2:9-10"]}, {"title": "God's Self-Existence and Independence", "subpoints": ["Only God is self-existent; all creation depends on Him", "God chose to create and love us, not out of necessity but by grace", "God does not need the church; He will build His church regardless of human circumstances", "Our worth is elevated when we realize God does not need us but chose to love us anyway"], "scripture": ["Matthew 16:18", "Acts 17:28"]}, {"title": "God's Faithfulness Revealed in His Name", "subpoints": ["God's statement 'I am the God of Abraham, Isaac, and Jacob' reveals His faithfulness across centuries", "The central promise of God—'I will be your God and you will be my people'—depends on His faithfulness", "This promise is renewed in the New Covenant through Jesus Christ", "God's faithfulness is rooted in His unchangeable nature"], "scripture": ["Exodus 3:15", "Malachi 1:6-7"]}, {"title": "Yahweh: The Name of the Trinity", "subpoints": ["Yahweh is the name of the Father, Son, and Holy Spirit", "The word 'Lord' in Scripture refers to the whole Trinity, not just the Father", "Jesus claimed this name for Himself, identifying as the 'I am'", "Every attribute of God—self-existence, infinity, eternality, unchangeableness—is contained in the name Yahweh"], "scripture": ["Hebrews (multiple passages)", "John 8:58", "John 6:35, 8:12, 10:7, 10:11, 11:25, 14:6, 15:1"]}, {"title": "Honoring God's Name in Worship and Life", "subpoints": ["The third commandment forbids taking the Lord's name in vain—misusing anything by which God makes Himself known", "God's name is present in worship and is honored through proper worship", "God's name is equated with Scripture itself; we honor Him by honoring His Word", "We desecrate God's glory when we take His name in vain through our words and actions"], "scripture": ["Exodus 20:7", "Malachi 1:6-7"]}, {"title": "Jesus Christ: The Ultimate Revelation of God's Name", "subpoints": ["Jesus identified Himself as 'I am,' claiming the name of Yahweh", "The Jews understood His claim and sought to stone Him for blasphemy", "Jesus is the clearest and ultimate revelation of who God is", "To know God, one must know Jesus Christ; there is no other way to truly know Him", "All of God's self-revelation through creation, Word, and providence culminates in Jesus"], "scripture": ["John 8:58", "John 14:6", "Philippians 2:9-10"]}], "tags": [{"tag": "God's Name", "source": "detected"}, {"tag": "Yahweh", "source": "detected"}, {"tag": "Jesus Christ", "source": "detected"}, {"tag": "God's Attributes", "source": "detected"}, {"tag": "Worship", "source": "detected"}, {"tag": "Trinity", "source": "detected"}], "scripture_references": [{"reference": "Hosea 12:2-6", "type": "quoted", "source": "detected"}, {"reference": "Hosea 12:5", "type": "quoted", "source": "detected"}, {"reference": "Exodus 3:14", "type": "quoted", "source": "detected"}, {"reference": "Exodus 3:15", "type": "quoted", "source": "detected"}, {"reference": "Acts 17:28", "type": "quoted", "source": "detected"}, {"reference": "Philippians 2:9-10", "type": "quoted", "source": "detected"}, {"reference": "Matthew 16:18", "type": "referenced", "source": "detected"}, {"reference": "John 8:58", "type": "quoted", "source": "detected"}, {"reference": "John 6:35", "type": "referenced", "source": "detected"}, {"reference": "John 8:12", "type": "referenced", "source": "detected"}, {"reference": "John 10:7", "type": "referenced", "source": "detected"}, {"reference": "John 10:11", "type": "referenced", "source": "detected"}, {"reference": "John 11:25", "type": "referenced", "source": "detected"}, {"reference": "John 14:6", "type": "referenced", "source": "detected"}, {"reference": "John 15:1", "type": "referenced", "source": "detected"}, {"reference": "Malachi 1:6-7", "type": "quoted", "source": "detected"}, {"reference": "Exodus 20:7", "type": "referenced", "source": "detected"}], "transcript": "## What's in a Name?\n\nWe're going to consider one verse out of Hosea 12. It is verse 5. Let us read verses 2 through 6.\n\n> \"The Lord also brings a charge against Judah and will punish Jacob according to his ways. According to his deeds, he will recompense him. He took his brother by the heel in the womb and in his strength, he struggled with God. Yes, he struggled with the angel and prevailed. He wept and sought favor from him. He found him in Bethel and there he spoke to us. That is, the Lord God of hosts. The Lord is his memorable name. So you, by the help of your God, return. Observe mercy and justice and wait on your God continually.\" (Hosea 12:2-6)\n\nUsed to be that names meant a lot of things. I often speak at Heritage Christian School where Darren and Carol's son serves as principal. I like interacting with the kids and I ask them their names. I'm so thankful when there's a Danny or Sam, because most of the names I cannot pronounce anymore or even understand what they are saying.\n\nBut names used to mean something. There's something in a name. When you ask the question, \"What's in a name?\" Well, something is in that name. And when that name is God's name, then everything is in that name.\n\n## The Name of God: Yahweh\n\nIn verse 5, Hosea says, \"That is the Lord God of hosts. The Lord is his memorable name.\"\n\nHosea tells us that the name of God, the God of the Bible, is Yahweh. The name of God is not simply \"God\"—God is a title. It's a title that Yahweh bears as the God who created heaven and earth. His personal name, the one that he chose to reveal himself by, is Yahweh. Grammatically it's not quite Yahweh, but that's how we say it. It is the God who is.\n\nThere's a lot in that name. Not only does Hosea say that God is the Lord Yahweh, he says that he is the Lord God of hosts—the God of Heaven's armies. God of hosts is the most common title for God in the Old Testament. God is the general of Heaven's armies. Jesus bore that title as well.\n\nRemember when Peter pulls his sword out and strikes the ear of the servant, and Jesus glues it back onto the servant. Then he says that if he wants, he could bring legions of angels. It's the same thing he told Pilate—they had more legions of angels than the entirety of the Roman army. If his kingdom was of this world, he would bring them. So Jesus is also the general of Heaven's armies. We see that here in our passage.\n\n## The Meaning of Yahweh: \"He Is\"\n\nWhat does the name of God mean—Yahweh? Literally it means \"He is.\" There's a different construction in Exodus 3:14, which says, \"I am that sent you.\" When you talk about God, you don't say \"I am,\" you say \"He is.\" So that's his name. He is.\n\nWhat does it mean then for God to be \"He is\"? It means that he's ever present. There's never a time when God was. There's never a time that God will be. God always is. Everything surprises him. Everything is in the present for him. And he's always present.\n\nThe fact that he is—that he is—means that he's unchanging. He always is. He doesn't become something else. So our God is a God who doesn't change. And that has all kinds of significance to our Christian walk.\n\nWe don't have to guess what God expects of us because he doesn't change. What he said is always the same. If you lived in the ancient Near East, that would be of great joy to you, because every god of the nations did not let the people know what he expected of them. They would do this kind of sacrifice today, hoping that their god would be pleased. If there was some sort of sign in Providence that things turn better, then okay, he liked that sacrifice. But then tomorrow there's a flood and everything's gone. So they have to do something else because now they don't know what God wants. They do something else and that maybe works and their god now does something good for them. But then that changes.\n\nThat's not our God. Our God is unchanging because he is always the same.\n\n## God's Self-Existence\n\nBecause his name is Yahweh, he is self-existent. He's the only being that's self-existing. His name is not \"I am becoming.\" His name is \"is\"—always is. There's never a time where he's not. So he exists in and of himself.\n\nThat's very important for us to realize that God is the only one who is self-existing. None of us are self-existing. Even though sometimes we might act as if we are independent from everything else, but in reality we are not. We depend on God. Remember what Paul said, quoting the Athenian philosophers and poets in Acts 17: \"In God we live and move and have our being.\" We are completely dependent on God. But God is self-existing. That's the doctrine of the aseity of God—that God is self-sufficient.\n\nThis name then tells us that God does not need us. I read evangelistic pages that say, \"God really needs you. Come to him and he can use you. He needs you.\" To which God says, \"No thank you. I'm okay without you. I didn't need to create you. I did not need to create anything. I exist in and of myself.\"\n\nAnd yet he chose to create us. And he chose to love us. Not because that brings more fulfillment to him—because God was perfectly happy in himself in his triune existence before he created anything. He had no needs because having needs is a sign of being limited. He had no needs. And yet he chose to create you and to love you, which goes beyond any benefit to himself.\n\nSo our existence is elevated when you realize that God does not need us.\n\nRemember what Jesus said about his church? Remember when he says, \"I need Nick, otherwise my church is going to fail\" or \"I need Jim, otherwise my church is going to fail\"? No, he says, \"I will build my church. And the gates of hell will not prevail against it.\"\n\nWe see the church going through ups and downs in the fashion of the United States. We see Europe completely living in a post-Christian age and saying, \"Oh man, the church needs this and the church needs that.\" And God says, \"No thank you. I am the self-existing God. I will build my church whether you are on board or not.\" So we better just get on board and go with him.\n\n## God's Faithfulness\n\nThe fact that he is Yahweh—\"He is\"—tells us that he is also faithful.\n\nAgain and again in the Old Testament, he is Yahweh, the God of Abraham, of Isaac, and of Jacob. Usually that phrase is used when speaking to the people of God centuries after the patriarchs were gone. So what is God Yahweh saying when he says, \"I am the God of Abraham, the God of Isaac, the God of Jacob\"?\n\nOne thing that our Lord tells us—somewhat unrelated to what we're talking about—is that he's the God of the living and of the resurrection. But this also tells us that he's the God who is faithful, because he is. The promises he made to Abraham, to Isaac, and to Jacob—and the primary promise he made to them is \"I will be your God and you will be my people\"—remain true to his faithful people. That is the central promise of the New Covenant. God is our God and we are his people.\n\nWe tend to assume that as such a common, simple term or idea, but it's only true because God is faithful. He didn't have to be our God. He didn't have to make us his people. And yet he does. He does because he is the faithful God.\n\n## Yahweh: The Name of the Trinity\n\nAlso, Yahweh is the name of the Father, Son, and Holy Spirit. The Father is. The Son is. The Holy Spirit is. Yahweh is the title of all three persons in the Trinity.\n\nWe see often in your Testament—so when you look, you see the word \"Lord\" in your New Testament, it's capital L, capital O, capital R, capital D. Don't think of just the Father. It's a whole Trinity speaking there. It's a whole Trinity present. It's our triune God present.\n\nIn the New Testament, often in the book of Hebrews, for example, several passages say that the Spirit said when you go to the Old Testament it is Yahweh speaking. Jesus attributes to himself also things that Yahweh says, and the Father does the same.\n\nSo what's the name? It's the name of the Trinity, the triune God that saves his people.\n\n## The Fullness of God's Name\n\nThe name of God Yahweh stands for all who he is in Jesus' name. Every attribute of God is in that name—his self-existence, his infinity, his eternality, his unchangeableness, his simplicity—all in that name. He is.\n\nThink about it. God could have chosen any name for himself, but he chose to call himself \"He is.\" In that name, we honor him by honoring everything that reveals himself, that he reveals himself by. Everything that Yahweh reveals himself by, we need to honor and love and glorify. So his creation, his word, his providence are there.\n\n### The Connection to Exodus 3\n\nThis passage draws back from a passage in the book of Exodus. Turn your Bible to Exodus chapter 3, verses 14 and 15.\n\n> \"And God said to Moses, 'I am who I am.' And he said, 'Thus you shall say to the children of Israel, I am has sent me to you.' Moreover, God said to Moses, 'Thus you shall say to the children of Israel, The Lord God of your fathers, the God of Abraham, the God of Isaac, and the God of Jacob has sent me to you. This is my name forever. And this is my memorial to all generations.'\" (Exodus 3:14-15)\n\nYou see, Hosea 12:5 echoes this—where his name is memorable or unforgettable. And what's that name? He is.\n\n## Jesus: The Ultimate \"I Am\"\n\nWe also could say that that name is Jesus. Remember in Philippians chapter 2 that because the Lord Jesus Christ lowered himself, humbled himself to be in the form of man, lowered himself even further to be crucified, that God has exalted him and then done what? Gave him a name above every name to which every knee will bow. Some will bow under the weight of his grace. Some will bow under the weight of his judgment and his wrath. But that's the name that God has given to himself. And that name is revealed in the Bible but also is revealed in his creation. And we are to honor that name.\n\nRemember what the third commandment is: \"Do not take the Lord's name in vain.\" Our catechism says that what that commandment forbids is profanity or abusing anything whereby God makes himself known.\n\nBrothers and sisters, God's name is present in worship. Malachi says that in Malachi 1:6 and 7:\n\n> \"A son honors his father and a servant his master. If then I am a father, where is my honor? And if I'm a master, where is my reverence? Says the Lord of hosts to you priests who despise my name. Yet you say, 'In what have we despised your name?' You offer defiled food on my altar.\" (Malachi 1:6-7)\n\nThe name of God is in his worship. We honor God by worshiping him and worshiping him properly.\n\nGod's name is often equated with the scriptures themselves. And we honor him by honoring the scriptures. When we take the Lord's name in vain by our own actions or words, we are desecrating his glory because his name is a representation of his glory.\n\n## What's in a Name?\n\nIf that name is God's everything—he is Yahweh, the self-existing, the faithful, the unchanging God who reveals himself ultimately through the Lord Jesus Christ.\n\nRemember how in the Gospel of John, Jesus says that he is the \"I am.\" We often talk about the seven \"I am\" statements, but there's at least nine of them because of the ones in John chapter 8. \"I am the vine. I am the door. I am the good shepherd.\" But the most significant one is in John chapter 8, where Jesus tells the Pharisees, \"Before Abraham was, I am.\"\n\nIn Greek: ego eimi. In Aramaic it would have been almost the same word as in Exodus 3:14. The Jews understood it because they picked up stones to cast at Christ to stone him because he was claiming to be Yahweh.\n\nAnd that's the ultimate revelation of the name of God—in Jesus. So do you want to know God? This God whose name is Yahweh? Know Jesus. There's no other way to know him than through the Lord Jesus Christ.", "id": "Unknown-the-memorable-name-of-god-yahweh-hosea-12-5", "source_files": ["Hosea 12-5 (Pastor Tito Lyro).txt"]};
