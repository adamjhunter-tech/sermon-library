window.LESSON_DATA = {"title": "Guard Your Heart: The Wellspring of Life", "speaker": "Pastor Doug Leaman", "date": "Unknown", "session": "", "series": null, "series_part": null, "parts": 1, "summary": "Pastor Doug Leaman expounds on Proverbs 4:23, emphasizing that the heart is the religious and spiritual center of human existence from which all issues of life flow. He contrasts biblical understanding of the heart with modern secular confusion, arguing that guarding one's heart through worship of God and submission to His word is essential for wise living and cultural renewal.", "outline": [{"title": "The Crisis of Modern Confusion", "subpoints": ["The world has abandoned God's truth for lies and replaced worship of God with worship of creatures and idols", "Intellectual leaders like Darwin, Freud, and Marx created systems that ignore man's need for redemption and true knowledge of God", "Without understanding that man is made in God's image, modern psychology and secular thinking lead to chaos", "False religion inevitably fills the void left when true worship is abandoned"], "scripture": ["Romans 1:18", "Romans 1:25", "Genesis 3", "Proverbs 1:7"]}, {"title": "Understanding What Man Is", "subpoints": ["Man is made in the image of God, giving human life dignity, purpose, and direction", "Man consists of body (from dust) and spirit (God's breath), making him a unified being", "Without knowing God, man cannot truly know himself—man does not know himself if he does not know God", "The loss of this truth has led to confusion about gender, identity, and the value of human life"], "scripture": ["Genesis 1:27", "Genesis 2:7", "John Calvin"]}, {"title": "The Heart as the Center of Human Life", "subpoints": ["The heart (Hebrew: lev) is the invisible spring and center of the inner life—unifying mind, desires, affections, will, conscience, and commitments", "The heart is the religious and moral command center from which all thoughts, actions, and relationships flow", "Thoughts are not neutral but directed by the heart's deepest loyalties and commitments", "The imagination of man's heart is evil from youth, showing the heart's fundamental problem in fallen humanity"], "scripture": ["Proverbs 4:23", "Mark 7:21", "Genesis 8:21", "Matthew 5"]}, {"title": "The Primacy of Worship in the Heart", "subpoints": ["Man is inescapably a worshiper; the heart is religiously controlled and driven by worship", "We live and move and have our being in God; our lives are lived before His face", "Fallen man exchanges worship of the true God for worship of creatures, becoming foolish and worthless", "Worship shapes who we become: worship God and be renewed; worship idols and become ignorant and enslaved"], "scripture": ["Acts 17:28", "Romans 1:25", "Jeremiah 2:5"]}, {"title": "The Imperative to Guard Your Heart", "subpoints": ["Guard your heart with all diligence because it is the source of all life's issues", "This is a personal responsibility—no one else can guard your heart for you; you are one on one with the Lord", "Examine what you love, treasure, and worship; do heart work and heart management", "Fill your heart actively with worship, dependence on God, prayer, fellowship, and God's word, not with worldly idols"], "scripture": ["Proverbs 4:23", "Matthew 6:33", "Matthew 22:37-39", "Jeremiah 17:9"]}, {"title": "The Promise of New Hearts in Christ", "subpoints": ["The ultimate hope is not mere self-improvement but the covenant promise of God to give new hearts", "Jesus Christ, our covenant head, died in our place and gives us new hearts and new spirits", "With new hearts in Christ, we have the power to actually obey God's command to guard our hearts", "We can grow in wisdom, love, and service to God by prioritizing the kingdom above all earthly achievements"], "scripture": ["Ezekiel 36:26", "Matthew 6:33"]}], "tags": [{"tag": "Heart", "source": "detected"}, {"tag": "Worship", "source": "detected"}, {"tag": "Proverbs", "source": "detected"}, {"tag": "Christian living", "source": "detected"}, {"tag": "Biblical counseling", "source": "detected"}, {"tag": "Cultural apologetics", "source": "detected"}], "scripture_references": [{"reference": "Proverbs 4:20-27", "type": "quoted", "source": "detected"}, {"reference": "Proverbs 4:23", "type": "quoted", "source": "detected"}, {"reference": "Proverbs 1:7", "type": "quoted", "source": "detected"}, {"reference": "Genesis 1:27", "type": "quoted", "source": "detected"}, {"reference": "Genesis 2:7", "type": "quoted", "source": "detected"}, {"reference": "Genesis 3", "type": "referenced", "source": "detected"}, {"reference": "Genesis 8:21", "type": "quoted", "source": "detected"}, {"reference": "Romans 1:18", "type": "quoted", "source": "detected"}, {"reference": "Romans 1:25", "type": "quoted", "source": "detected"}, {"reference": "Mark 7:21", "type": "quoted", "source": "detected"}, {"reference": "Matthew 5", "type": "referenced", "source": "detected"}, {"reference": "Matthew 6:33", "type": "quoted", "source": "detected"}, {"reference": "Matthew 22:37-39", "type": "quoted", "source": "detected"}, {"reference": "Acts 17:28", "type": "quoted", "source": "detected"}, {"reference": "Jeremiah 2:5", "type": "quoted", "source": "detected"}, {"reference": "Jeremiah 17:9", "type": "quoted", "source": "detected"}, {"reference": "Ezekiel 36:26", "type": "quoted", "source": "detected"}, {"reference": "Colossians 1", "type": "referenced", "source": "detected"}, {"reference": "Psalm 2:11-12", "type": "referenced", "source": "detected"}], "transcript": "## Scripture Reading: Proverbs 4:20-27\n\n> My son, give attention to my words, incline your ear to my sayings. Do not let them depart from your eyes, keep them in the midst of your heart, for they are life to those who find them, and health to all their flesh. Keep your heart with all diligence for out of it spring the issues of life. Put away from you a deceitful mouth and put perverse lips far from you. Let your eyes look straight ahead and your eyelids look right before you. Ponder the path of your feet and let all your ways be established. Do not turn to the right or to the left. Remove your foot from evil.\n\n## Opening Remarks\n\nWhat a blessing it is to be here with you all and to see such a great number. I understand a lot of people were traveling, but that's fine because there would be no room for everyone. It's a great encouragement to see how God has sustained this local church for so many decades and to see how the Lord is using you. We praise the Lord for that.\n\nI want to thank you for all your prayers and your togetherness with us in Brazil. We are very thankful for the way you have supported us and prayed for us through the years. I'm especially grateful for your help with the Project Sholedadah Glory, which has been a big encouragement to my heart to see those funds come in and allow things to move forward. We praise the Lord for you.\n\nThis morning I want to meditate on Proverbs 4:23—guarding the wellspring of life. There are several translations of this verse:\n\n> Keep your heart with all vigilance for from it flow the springs of life.\n\n> Keep your heart with all diligence for out of it spring the issues of life.\n\n> Guard your heart above all else for it is the source of life.\n\nYou know this text well. You've read it a thousand times. Most of you have memorized it.\n\n## The Wisdom of Christ Greater Than Solomon\n\nHow desperately we need the wisdom of Solomon, this writer, this king. But you are all future kings and princes under your union with Christ. So we need to know princely wisdom. But even more, we need the wisdom of the one who was much greater than Solomon—the Lord Jesus Christ—the precious wisdom of Christ. He is the Creator of man. He is the architect of mankind. He knows who man is and how he functions.\n\nIn His word, we see even in this text some of the important, profound truths that God has clearly displayed before us so that we can learn about human life and who we are. This is not merely a proverb for better living. It is God's diagnosis and His imperative on how we can live a wise and holy life in His presence, guided by His word.\n\nOur prayer is that under the counsel of God's word, as we look at this one text and have various parts of Scripture shed light upon it, we might be able to meditate more profoundly. By God's grace, we might see some amazing truths so that we might live better to the glory of God. May our lives become dedicated because of all that He has done for us in the gospel, bringing us into union with Christ, so that we might respond with wisdom to the question: How should we then live in light of His glorious gospel according to His profound mercies given to us?\n\nWe are called to renew our minds and think God's thoughts after Him.\n\n## The Crisis of Modern Confusion\n\nBut we live in a time of great crisis and confusion. I don't know when we have been so confused over the past 2000 years. The folly and chaos of Babel is upon us. The folly of Genesis 3—the fall and rebellion against God—is on full display, even in America. It has been on display in Europe for a very long time, and it has led to a despairing cry. After World War II, the postmodern age came upon us, and now the wise men, having collected wisdom through the ages, cry together: \"There is no truth guiding us.\"\n\nSocrates, the great and famous philosopher of old times, urged self-knowledge upon mankind. \"You need to know yourself,\" he said. That was the greatest objective of human pursuit in life—to know yourself. But apart from the Triune God who reveals Himself and who reveals truth about man in Scripture, this supposed knowledge collapses into confusion and chaos. And today we see the fruit of it.\n\nYou see it very clearly in Recife where we live, but you see the same chaos in Olympia, in Portland, in Seattle on the West Coast, and in so many places of the world. This supposed knowledge collapses into confusion, and we see the fruit of it today.\n\nDiversity is the great call. It's the new orthodoxy, the new belief structure, the new mantra. Diversity and gender are now considered self-invention. We create it out of our desires. It's not given to us by God. And so we live in a clown world of absurdity, confusion, and chaos all around us.\n\nThis is no accident. It's the outworking of total depravity. It's the fruit of the noetic—the mental impact of the fall upon human reason and rationality. There is confusion upon man, the darkening of the mind that follows rebellion against God.\n\n## The Covenant of Creation and the Fall\n\nIn the Covenant of Creation in the beginning—Genesis 1 and 2—we see God's beautiful creation of man. Man is made upright. He is made in the image of God. He is made in fellowship with God. He walks with God and speaks with Him and communes with Him. That's the way things ought to be. That's the way God made us.\n\nBut our first parents were seduced by the serpent. You know that story in Genesis 3. They were presented with two options: God's word and God's presence, or the seductive invitation to be divine, to choose for themselves, to think and reason for themselves. They chose human reason and autonomy. \"We shall do it our own way. We shall choose between the options instead of following in humble submission to our Creator and God.\"\n\nThey exchanged the truth of God for a lie. That is the commentary of the Apostle Paul in Romans 1 upon what mankind has done. They chose a lie over the truth of God.\n\nThe impact of this rebellion upon unregenerate thinking creates all this confusion. This is the backdrop of why our text is so important in all times, and certainly we can see it so clearly in the many manifestations of chaos and confusion around us.\n\nMan suppresses the truth in unrighteousness (Romans 1:18). Both Jews and Greeks—there is no class of men that escaped this reality of being spiritual creatures who rebelled against God. Our father Adam, the first representative of the human race, fell, and we all fell in him. And the text says, \"There is none then who understands. There is no one who understands clearly the glory of God and the way of his salvation and how to live for his glory.\"\n\nThere is no man alone who can see that. We are dependent upon revelation—God revealing Himself, Him speaking to human creatures. The word of grace, the gospel, and true wisdom come from God alone. Man does not find it in himself.\n\n## The Fathers of Modern Confusion\n\nConsider some of the fathers of modern confusion. We emphasize biblical counseling here as well. Praise the Lord for that. But think about the world of psychology. Consider Darwin, Freud, Karl Marx, Carl Jung—some of these brilliant men with natural talents. Yet their hearts were unguarded. They did not guard their hearts, and from the heart flows the issues of life.\n\nThese great intellectual leaders worshiped the creature rather than the Creator. And so the applications of that in their thinking are corrupted. Freud reduces man to biological impulses. Marx reduces man to economic forces. And so they do not have the truth about man.\n\nEvolved animals need no redemption. So the gospel—the message for the world, for the university, for Evergreen State—is totally and completely foreign to them. Man needs no gospel because he's a machine, because these men have been led by those who worship the creature rather than the Creator. So there is confusion and chaos.\n\nThis is what our universities are full of. Our children go to these universities. Our presidents, our legislators, and our counseling rooms are filled with these kinds of solutions that come from darkened hearts. There is no fear of God in their hearts.\n\nThe Bible teaches us that the heart of man is not a vacuum. It is not neutral. It is not empty. When they stop worshiping God, it does not mean they worship nothing. The void is filled, and they become worshipers. They love things rather than the Creator.\n\nThe Bible says to the kings of the world: \"Serve the Lord with fear and rejoice with trembling\" (Psalm 2:11-12). Religion will not be banished ever. So when we preach the word of God into a culture and into the hearts and lives of our children, we are not just fighting against neutrality or nothingness. We are fighting against false religion.\n\nIt cannot be banished. It is replaced with something else. The worship of God is replaced with the worship of something else. Paul clearly summarizes it: You will worship the true God or you will worship an idol. And so we need to preach the gospel. We need reformation and revival in Brazil and to address the backdrop of this chaos and confusion that has become silliness.\n\nThe wise men of the world are weaker in understanding than the most simple child nowadays because we have gone so far from the word of God.\n\n## The Foundation of All Knowledge\n\nIn contrast to all this confusion and chaos, Proverbs 1:7 declares a foundational text that sheds light on the whole book of Proverbs:\n\n> The fear of the Lord is the beginning of knowledge. Fools despise wisdom and instruction.\n\nAnd such were some of us. We were all lost. We were all fools, darkened in our understanding. But God's grace came and saved us. That's the message we bring to the world: the message of redemption, of forgiveness, and an invitation back to the Lord and to worship correctly. That is what will restore all the confusion and chaos.\n\n## Who Are You and What Is Man?\n\nWho are you and what is man? John Calvin is remarkable in the very opening words of his foundational work. In the first large volume he wrote, the title of the first chapter astounded me when I read it many years ago, especially after studying biblical counseling and seeing our antithetical relationship with modern secular psychology.\n\nHe wrote: \"Man does not know himself if he does not know God.\"\n\nIt was so clear to me. Obviously, all these men do not know God, and so they do not know anthropology. They do not know man. And so what are they doing? It's the blind leading the blind, unfortunately, in so many ways.\n\nAll sound theology and anthropology must be a subcategory of Scripture—of true theology. It must come from God's revelation. Genesis 1:27 tells us who man is:\n\n> He created him male and female in the image of God. He created them.\n\nSuch a simple truth, but so profound. We're made in the image of God. The lost world does not know that we were made in the image of God. And that is why they will kill so many babies. Carl Truman, whom you have had here, has written recently that abortion is like the sacrament of secular religion. It is the way to kill God. Since they cannot kill God, they will kill the image bearers of God. And so they are killing by the millions those who are creatures made in the image of God. It is a rebellion against God. It is the new religious sacrament.\n\nGenesis 2:7 goes on to tell us:\n\n> The Lord God formed man from the dust of the ground and breathed into his nostrils the breath of life, and the man became a living being.\n\nSo we know that body comes from dust and God's Spirit brought life into man. These bodies and spirits together are made in the image of God. We know where we came from, and this gives dignity to human life. It gives purpose. It gives direction.\n\nThere are so many people lost out there. If you just walk around the streets, it is so sad. They don't know if they're males or females. Some of them think they're dogs. Some think they're machines. They don't believe that they are image bearers of the Triune God—rational, moral, spiritual, relational—all connected to the Lord.\n\nThis text so clearly speaks to us about man and who he is.\n\n## The Heart: Center of the Inner Life\n\nWhat is the heart in Hebrew—*lev*? It is the center of the inner life. The heart is the center of who you are. It is a unifying aspect that brings together our minds, our desires, our affections, our wills, our conscience, our commitments in life, and our relationships. All this is connected with the heart, and none of it is disconnected from the heart because the heart is the center of our being, of our inner world. It is the invisible spring.\n\nPlease understand why science and modern man cannot speak authoritatively to this issue: because they cannot see it. It is revealed from God. It is a truth that comes down from heaven, and we have it in the word of God. But you cannot see it in a scientific lab. So we depend upon understanding man through Scripture.\n\nWe can study man and see components of man, but if you don't know who he is in his essence, the main part will be missed. And so you are fragmented in your understanding of who man is. Your attempts to help him, apart from God's word, will end in failure.\n\nThe heart is the center of the inner life. In Mark 7:21, Jesus gives us more information and commentary upon this heart, this invisible spring from which the issues of life flow. He says:\n\n> For from within, out of the heart of men, proceed evil thoughts, adulteries, fornications, murders.\n\nSo thinking, willing, actions—these spring from the heart. We are not neutral creatures. We are not impacted primarily by outside forces, though those can impact us. We are driven by inner drives and problems within the heart.\n\nThoughts are not neutral. They are directed by the heart's deepest loyalties. Please understand that. The mind is not neutral, but it is directed by the heart's commitments.\n\nAnd so certainly the text this morning says: \"Guard your heart with all diligence, for out of it springs the issues of life.\"\n\nThis word heart is really important. We need a good understanding of what it means. Once again, it is the entire compass of the inner man.\n\nProfessor John Murray of Westminster said it is like a complex, like a shopping center. There are various components, but it is all one thing. There is will, there are emotions, there are desires, there are longings, there are thoughts, but it is one thing. It is the heart.\n\nIn Genesis 8:21, the Lord says:\n\n> The imagination of man's heart.\n\nYou see, imaginations come from where? The heart. The Bible defines this. We can deduce it from God's word. The activities of the hearts of man are imaginative. And the text says:\n\n> The imagination of man's heart is evil from his youth.\n\nSo here we see, once again, that thinking, imagining, and purposes all flow from the heart. It is this moral and spiritual command center for human life. Everything else flows from this inner core—relationships, everything.\n\nIn the New Testament, the Greek *cardia* is where we get the word cardiologist—the people who work on our hearts. And *psyche* points to the same reality: the soul, the inner world that interacts with all creation.\n\nOnce again, I am going to repeat it: there is no neutrality. You bring your heart to every endeavor. In its capable reality, man, your heart is there wherever you go. Your heart is there in your thinking, in your relationships, in your marriage, in your family, in the job that you do, in your calling and vocations.\n\nYou played soccer yesterday and lost, and your heart is interacting with all those things inescapably. The totality of life then is connected to this religious inner core.\n\nThere is a big problem we have had down through the ages: this attempted divide between the secular and the sacred. We worship on Sunday—we give our heart to the Lord. But as we live out there in the world, we don't need to live *coram deo*—before the face of God. And there is just this divide between secular things and sacred things. And so the world is left behind, untouched by the wisdom of God's word.\n\nWe see that tremendously in Roman Catholic countries. But the text here says—now understanding a little bit more and reflecting more about what the heart means—\"above all else, guard your heart.\"\n\n## Why Guard Your Heart?\n\nWhy is this a priority? Because, once again, the heart is the religious center of human existence. I am going to repeat some verses that teach about the importance of religion and worship for life. This is not controversial. We are just being reminded today that the heart is religiously controlled by worship. That is the center of human reality.\n\nIn Acts 17:28, God's word teaches us:\n\n> In him, we live and move and have our being.\n\nIt is in God's reality. We are surrounded by His presence. \"Where can I flee from His presence?\" Our life is lived before the face of God.\n\nWe were created for God's presence and to be in covenant relationship with Him and to worship Him. The fall did not erase this. Men are still made in the image of God, but it is twisted, darkened, fragmented, and broken.\n\nOnce again, Paul says in Romans that they exchanged the truth of God for a lie. This is the famous passage in Romans 1:25. Man worships the creature rather than the Creator. They serve the creature, the things of the world, men and self-glory and just feelings and whatever else—instead of the Creator God, the Triune God and the Savior.\n\nAnd that fallen heart, that broken worship, is what transforms them into becoming foolish. It is a hard word. Jeremiah says it. The prophets say it:\n\n> What wrong did your fathers find in me that they went far from me and went after worthlessness and became worthless?\n\nThey started worshiping vain things and they became vain and simple. And soon we will see the fruits of it in our culture—in poverty, in confusion, in chaos—if God's grace does not revive us again. We will become a weak people.\n\nYou say, \"Well, where is this happening?\" Look to Europe today. As they abandon God, they are literally being taken over by foreign and strange religions. They have left the God that made them wise and prosperous, and now they are becoming enslaved.\n\nAnd if America does not wake up, we will fall in that same path and pattern. All this blessedness around us—the fact that I can go from Tacoma to Olympia and not fall in a pothole, drive to Oregon and see so many amazing things on sale all around us, the cleanliness, the air conditioning, the lack of dust, all these things—are fruits and blessings from a people that one day worshiped God.\n\nAnd if we abandon all these things, even the simple blessings of this world can vanish away because we become like what we worship. So worship the living God and you are renewed. Worship idols and you become stupid and ignorant.\n\nBrothers, the great battle for the heart—Jeremiah says it: \"The heart is deceitful above all things. And that is why you need to guard it. It is desperately sick.\"\n\nMatthew 5 says: \"What comes out of the mouth proceeds from the heart. This defiles a person.\"\n\nOnce again, the centrality of the heart. So we need to do heart work. We need to do heart management. We need to understand how human life works.\n\nWe cannot just correct only thinking. We cannot just correct actions. Well, we need to correct actions according to what standard? Even the fact that we love God's standard is something that we must do from a heart commitment.\n\nSo if we do not have a heart that is dedicated to God, we are lost as to what should be the true standard of human life. And therefore we don't know how to renew our behaviors. And so behaviorism is just a walk in the dark.\n\nWe need to know what behaviors to put into our lives, and we need revelation. We need to have revelation as our ultimate authority. We need to be subservient and to worship and fear the Lord.\n\nThe fear of the Lord is the beginning of knowledge.\n\n## How to Guard Your Heart\n\nSo guard your hearts. And how can you do this?\n\nIt is a very personal thing. The text says, \"Guard your heart.\" This is your heart.\n\nThere is a sense in which the pastors and elders are doing a great job of guarding hearts. Families, fathers, and mothers should be guarding and protecting the hearts of their children every single day. But in the end, the text says, \"Guard your heart.\" No one else can do it for you.\n\nThere is a sense in which you are one on one with the Lord. We stand before the sovereign God, and we are called to submit to Him.\n\nJesus tells us to remove the log out of our own eye—the sins. See yourself as a sinner. Know how to do a self-analysis and work on those issues in your own heart before you see the speck—the issues in the life of others.\n\nEveryone has specks. Everyone is a sinner. Your husband is a sinner. Your wife is a sinner. Your uncle and other brothers and sisters in church—we are all sinners. But God's word says, \"See first in your own heart and life these problems.\"\n\nSo guard your heart. Examine what you love, what you treasure. Know it well. Know what you are worshiping.\n\nThere are so many great examples in Scripture. I think of Joseph quickly. He guarded his heart by anchoring his life in God's sovereignty. He was terribly treated by his brothers. He was thrown into the dungeon, into darkness. He was thinking about God's presence. He was thinking about God's sovereignty. And so therefore, he could have a heart that overflowed with forgiveness to his brothers. He was able to embrace them, and in the end, he knew that God was present.\n\nSo how do we fill up our hearts? What do we guard it with? It is not just a neutral thing. It is active. It is going to be worshiping.\n\nJesus tells us: \"Seek first the kingdom of God. Make that the central hub of what is going on in your heart.\" He says, \"Love your God with all your heart, mind, soul, and strength. And then love your neighbor.\"\n\nThose are the things that should really be filling a heart. Fill your heart with worship. Fill your heart with dependence upon the Lord, with prayer. Fill your heart with the sacraments—what we do here in church—and with fellowship with God's people, loving your neighbor. Fill it with wisdom, true wisdom, true thinking based upon God's word.\n\n## The Promise of New Hearts\n\nIn conclusion, brothers, there is the best promise and the best hope for us all and for our cultures—in Brazil, in Recife, and here.\n\nThe ultimate priority, given that the heart is so important, is that we could have new hearts. This is the great promise in God's word and the covenant of grace:\n\n> I will give you a new heart and a new spirit I will put within you.\n\nAnd this is fulfilled in Jesus, our covenant head, the one who died in our place and gives us life and renews our hearts.\n\nSo we can obey this imperative: \"Guard your hearts.\" Why? Because in Christ we have been given new hearts. Now we have new commands. We have the possibility of actually doing this. We can grow in wisdom. We can grow in love. We can grow in service to God and in clarity by guarding your hearts as the first priority.\n\nSo what do you judge today? What kingdom are you seeking? If you are seeking to be the state champion, if you are seeking the best thing in life, you are crushed and depressed and discouraged today. But if you recognize the ultimate sovereignty of God over each and every hair of your head, if you recognize that the header at the last second of the game that missed by this much is all in God's plan—then you can rest and you can move forward.\n\nMay the Lord bless you. May you have this heart that is set upon the kingdom of God. May you guard it with all diligence, for from it springs the issues of life. May God bless you, and may His grace keep your hearts and the knowledge and love of His Son until the day we see Him face to face.", "id": "Unknown-guard-your-heart-the-wellspring-of-life", "source_files": ["The Spring of Life (Pastor Doug Leaman).txt"]};
