// Lesson data embedded at build time
window.LESSON_DATA = {"title": "The Word of the Cross: God's Power and Wisdom (1 Corinthians 1:18-31)", "speaker": "Pastor Tito Lyro", "date": "Unknown", "session": "", "series": null, "series_part": null, "parts": 1, "summary": "Pastor Tito Lyro explores 1 Corinthians 1:18-31, examining how the message of the cross divides humanity into two groups—those who see it as foolishness and those who recognize it as God's power for salvation. The passage reveals how God's wisdom inverts worldly wisdom and transforms nobodies into God's sons and daughters through Christ.", "outline": [{"title": "The Word of the Cross Separates the Perishing from the Saved", "subpoints": ["The message of the cross is foolishness to those perishing but power to those being saved", "God designed this separation to eliminate human boasting and demonstrate His wonderful work", "All humanity falls into one of two categories with no neutral ground", "The gospel creates division wherever it is preached, as seen at Pentecost"], "scripture": ["1 Corinthians 1:18-19", "Isaiah 29:14", "Acts 2"]}, {"title": "The Word of the Cross Inverts Worldly and Divine Wisdom", "subpoints": ["What the world considers wisdom is actually foolishness to God", "The Greeks sought philosophical wisdom; the Jews sought miraculous signs", "God's greatest wisdom is the crucified and risen Christ", "The message of Christ crucified transcends all ethnic and cultural barriers", "Paul preaches the same gospel to diverse audiences without cultural accommodation"], "scripture": ["1 Corinthians 1:20-25", "Mark 11:28", "Galatians 3:28"]}, {"title": "The Word of the Cross Transforms Nobodies into God's Children", "subpoints": ["God calls mostly the weak, foolish, base, and despised things of the world", "This eliminates human boasting and demonstrates God's grace alone", "The church is made of sinners and misfits, not perfect people", "Weakness in the church becomes a beacon of light when focused on Christ", "Christians boast only in Christ and His work, not in themselves"], "scripture": ["1 Corinthians 1:26-31", "Jeremiah 9:23-24", "Galatians 6:14"]}, {"title": "The Purpose: Glorifying God and Boasting in Christ Alone", "subpoints": ["Christ became our wisdom, righteousness, sanctification, and redemption", "The goal is transformation both personally and corporately", "Our boast must be in the Lord, not in ourselves", "Understanding what we were saved from drives our worship and testimony"], "scripture": ["1 Corinthians 1:30-31", "Jeremiah 9:23-24"]}], "tags": [{"tag": "Gospel", "source": "detected"}, {"tag": "The Cross", "source": "detected"}, {"tag": "God's Wisdom", "source": "detected"}, {"tag": "Salvation", "source": "detected"}, {"tag": "Church Identity", "source": "detected"}, {"tag": "Humility", "source": "detected"}], "scripture_references": [{"reference": "1 Corinthians 1:18-31", "type": "quoted", "source": "detected"}, {"reference": "1 Corinthians 1:18", "type": "quoted", "source": "detected"}, {"reference": "1 Corinthians 1:23-24", "type": "quoted", "source": "detected"}, {"reference": "1 Corinthians 2:1-5", "type": "quoted", "source": "detected"}, {"reference": "1 Corinthians 2:2", "type": "referenced", "source": "detected"}, {"reference": "Isaiah 29:14", "type": "quoted", "source": "detected"}, {"reference": "Isaiah 29:19", "type": "quoted", "source": "detected"}, {"reference": "Acts 17:21", "type": "referenced", "source": "detected"}, {"reference": "2 Corinthians 2:14-16", "type": "quoted", "source": "detected"}, {"reference": "Galatians 3:28", "type": "referenced", "source": "detected"}, {"reference": "Galatians 6:14", "type": "quoted", "source": "detected"}, {"reference": "Jeremiah 9:23-24", "type": "quoted", "source": "detected"}, {"reference": "1 Corinthians 1:20", "type": "quoted", "source": "detected"}, {"reference": "1 Corinthians 1:25-31", "type": "quoted", "source": "detected"}, {"reference": "1 Corinthians 1:26", "type": "quoted", "source": "detected"}, {"reference": "1 Corinthians 1:27-28", "type": "quoted", "source": "detected"}], "transcript": "## The Word of the Cross: God's Power for Salvation\n\n> \"For the message of the cross is foolishness to those who are perishing, but to us who are being saved it is the power of God, for it is written, I will destroy the wisdom of the wise and bring to nothing the understanding of the prudent. Where is the wise? Where is the scribe? Where is the disputer of this age? Has not God made foolish the wisdom of this world? For since in the wisdom of God the world through wisdom did not know God, it pleased God through the foolishness of the message preached to save those who believe. For Jews request a sign and Greeks seek after wisdom, but we preach Christ crucified to the Jews a stumbling block and to the Greeks foolishness, but to those who are called both Jews and Greeks Christ, the power of God and the wisdom of God. Because the foolishness of God is wiser than man and the weakness of God is stronger than man. For you see your calling brethren that not many wise according to flesh, not many mighty, not many noble are called, but God has chosen the foolish things of the world to put to shame the wise and God has chosen the weak things of the world to put to shame the things which are mighty and the base things of the world and the things which are despised God has chosen and the things which are not to bring to nothing the things that are that no flesh should glory in his presence. But of him you are in Christ Jesus who became for us wisdom from God and righteousness and sanctification and redemption that as it is written you will glory so that him glory in the Lord.\" (1 Corinthians 1:18-31)\n\nAs you saw this morning, Paul persuades people of the Gospel of Jesus Christ because he is persuaded that it is the power of God unto salvation. He's personally persuaded that the word of the cross saves those who believe it. The question is: How about you? Are you persuaded of it?\n\n## Understanding Paul's Reaction to the Corinthian Church\n\nIn this passage we see Paul's Spirit-inspired reaction to the Corinthian Christians' attitude toward Bible-centered preaching in general and specifically to the preaching of the Gospel. By the time 1st and 2nd Corinthians were written, Corinth was the biggest city in the region and the most important city in Greece at the time. While Athens had historic importance, as far as first-century importance goes, Corinth would be the most important town.\n\nBecause of that, the culture highly valued Greek philosophy and Greek wisdom. What Luke said of Athens could be said of Corinth. In Acts 17:21, Luke says:\n\n> \"For all the Athenians and the foreigners who were there spent their time in nothing else but either to tell or to hear some new thing.\"\n\nAs we read 1st and 2nd Corinthians, we get the idea that those who were criticizing Paul were criticizing him because he didn't have some new thing to give them. He stuck to this old thing of Christ and Him crucified.\n\nFor the sophists of the time—those deemed wise by the world—how you said something was as important as what you said. Remember how we saw this morning that one of the criticisms Paul received is that he wasn't an orator in the same school as the Greek orators. He didn't speak with the flowery speech of the Greek orator. Though Paul was a gifted speaker, when you read these letters, you see that he was not a Greek orator nor did he want to be one.\n\nIn chapter 2, verses 1 through 5, Paul says:\n\n> \"I, brethren, when I came to you did not come with the excellence of speech or of wisdom declaring to you the testimony of God. I came to preach Christ and Christ crucified.\"\n\nIt seems that Paul found out that at least some of the Christians in Corinth had been infected with this desire for flowery speech that tickled their ears instead of Bible preaching. So Paul here explains with great precision why the preaching of God's word is necessary and what it means not to want it preached in favor of well-delivered talks on something else.\n\nPaul doesn't want us focused on the margins. He wants us to focus on the core, and the core is the Gospel of Jesus Christ. There are all kinds of people that are very passionate about all kinds of things. It's great to have passion, but we need to build our ministry in this church on the word of God as a reflection of who Christ is and what He has done.\n\n## Part One: The Word of the Cross Separates the Perishing from the Saved\n\n### The Core Message: The Word of the Cross\n\nThe first thing that we see here in this passage is that the word of the cross—that's how Paul calls the gospel—separates the perishing ones from the being-saved ones. Look at verses 18 and 19. Paul says:\n\n> \"For the message of the cross is foolishness to those who are perishing but to us who are being saved it is the power of God for it is written I will destroy the wisdom of the wise and bring to nothing the understanding of the prudent.\"\n\nWe need to start by defining the word or the message of the cross as Paul talks about it. Paul does that for us in verse 17 where he says:\n\n> \"For Christ does not send me to baptize but to preach the gospel not with wisdom of words lest the cross of Christ should be made of no effect.\"\n\nThe word of the cross is the Gospel of Jesus Christ. I love that Paul calls that the gospel—the word of the cross. You can't preach the gospel apart from the cross. You can't preach the gospel apart from Christ. That's why when you were interviewed by us in your membership interview, we ask you, \"Tell us your story. How do you come to know Jesus?\" and then remember what else we ask you: \"What is the gospel regardless of who you are?\" Because that's what saves—the word of the gospel, the word of the cross.\n\nPaul also defines that in verse 23 and then again in chapter 2, verse 2. The word of the cross is Christ crucified in the place of His people.\n\n### The Offensive Nature of the Gospel\n\nBrothers and sisters, sometimes the church is so worried about offending people. Yet what offends people the most is not our position on abortion. The most offensive thing we have is not what we think about gender. The most offensive thing is not some sort of political stand. The most offensive thing we have, and we can't get rid of it, is the message of the cross—that the world is perishing because of their sin and yet God has provided a way of salvation through the cross of Jesus Christ.\n\nPaul calls it this message. In Galatians, he calls it the offense of the cross. So if you are worried that you're going to offend people by your Christianity because of your stance on abortion or whatever, you can try to get rid of all that, and yet Christianity is still super offensive because of its message of the cross.\n\n### Two Groups: Belief or Rejection\n\nAs far as the message of the cross goes, all the people who have ever lived, including us here today, can be separated into two groups. That's what verse 18 tells us: Those who are perishing and think that the message of the cross—the crucified savior—is foolish, and there are some of you today that think that. And there are those who are being saved, to whom the message of the crucified savior is the very power of God.\n\nNo other group exists. There aren't neutral people. There are those that are seeking, there are those that may be friendly to the cross but aren't believing. No. You either think that the message of the cross is foolishness or you think that it is the power of God unto salvation. If you're not in the group that sees it as the power of God and salvation, then you automatically are in the group that thinks that the gospel is foolishness.\n\nLeon Morris is a great New Testament scholar from Australia—he's gone to be with the Lord now—and he said the message of the cross is not simply good advice telling us what we should do nor is it information about God's power. The message of the cross is God's power. That's where the power is.\n\n### The Separation at Pentecost\n\nWe see a real-life example of this separation in the account of Peter's preaching at Pentecost. Remember what happened at Pentecost: The Spirit comes in power upon the apostles as tongues as it were—tongues of fire coming upon them. Then they preach. The miracle is not that they preach in tongues. The miracle is that people heard what they preached in their own language. That's the miracle there.\n\nSo Peter preaches, and what happens? Over twelve different nationalities hear the message clearly proclaimed. They understand it. The babble is unbabbled—the language is brought together on the submission to Christ. They hear the gospel and they come to salvation. But that's not everybody present, is it? There are some that said, \"Look, they're already drunk. Look at how foolish they are.\"\n\nRight there, the gospel is dividing those who believe it as the power of God's salvation and those who see it as foolishness. Paul realized that here in 1st Corinthians 1:18. But even in 2nd Corinthians, he has seen that. In 2nd Corinthians 2:14-16, Paul says:\n\n> \"Now thanks be to God who always leads us in triumph in Christ and through us diffuses the fragrance of his knowledge in every place for we are to God the fragrance of Christ among those who are being saved and among those who are perishing to the one we are the aroma of death leading to death and to the other the aroma of life leading to life and who is sufficient for these things.\"\n\nThere are only two teams in this game: the gospel team and the team that thinks the gospel is foolish.\n\n### God's Wonderful Work\n\nThe message of the cross has this effect on people because God, who is the author of the message of the cross, designed it to work that way. We see that in verse 19 where Paul says:\n\n> \"For it is written, I will destroy the wisdom of the wise and bring to nothing the understanding of the prudent.\"\n\nHere Paul quotes from Isaiah 29:14 (only the second half of the verse), and that verse describes the wonderful work of God. Isaiah 29:19 says:\n\n> \"Therefore I behold again do marvelous work among his people a marvelous work and a wonder for the wisdom of their wise man shall perish and the understanding of their prudent man shall be hidden.\"\n\nThe reason God designed it this way is so that no one can say that through their own wisdom and deductions they came to know God as their savior and Lord. It is clear that salvation is entirely in His wonderful work. Isaiah 29:14 teaches that God is doing it, not we ourselves. That's the power of the Gospel.\n\nNo one—and I mean that no one—would have come up with the idea to save people through a man dying on a cross. It is God's wonderful work. It is God's idea. That's why it works.\n\n## Part Two: The Word of the Cross Inverts Worldly and Divine Wisdom\n\nThe second thing we see here is that the word of the cross turns wisdom into foolishness and foolishness into wisdom. See that in verses 20 through 25.\n\n### What the World Calls Wisdom is Foolishness\n\nThe first thing we see here is that what the world thinks is wisdom is actually foolishness. Verse 20 says:\n\n> \"Where is the wise, where is the scribe, where is the disputer of this age as not God made foolish the wisdom of this world for since in the wisdom of God the world through wisdom did not know God it pleased God through the foolishness of the message preached to save those who believe.\"\n\nThe wise here is the Greek philosopher. The scribe is the Jewish expert. The disputer is the one that's going to bring them all together against the word of the Gospel—the ones that are going to mock the word of the Gospel, the ones that are going to say this is foolishness.\n\nNotice that Paul is not afraid of the ideas that the best thinkers of the world have to offer. He says, \"Bring them on. Where are they? Where is the wise guy? Where is the scribe? Where is the disputer? Bring them on. I have an answer for them.\" That answer is in the Gospel. He knows that the worldview he has will stand the test of anything that man has to offer. We don't have to be afraid of it. Whatever idea people come up with, there's nothing new under the sun. There's only recycled ideas really. And secondly, the Bible answers it. We don't have to be afraid of that.\n\nWe see in verse 20 that God has made foolish the wisdom of this world. The wisdom of this world says that humility, meekness, and selflessness are weak characteristics. As a matter of fact, before the New Testament, the word that today we use for humility was a curse word. That's what you called somebody when you didn't like them—humble. Yet Christ has exalted that. See how He changed the wisdom of the world into foolishness.\n\nThe wisdom of this world says that you must think highly of yourself. The wisdom of this world says that power and might are where glory is found. This wisdom drives the world far away from God. If you're wondering about the foolishness of the wisdom of this world, just see the decisions coming out of the capital here in Olympia. You don't have to go much further to see what has become wisdom.\n\n### Being Marginalized for the Gospel\n\nThe wisdom of God is in what the world thinks is foolishness. That's why as a Christian, you shouldn't expect to be well liked by the world, because the world thinks that you are a fool. So don't try to be so friendly to the world when the Bible says that if you're a faithful Christian, the world will think that you are a fool.\n\nThere are two schools of thought here. One says that Protestants should do better at reaching high places. They argue that evangelicals are failing because we don't have Supreme Court justices who are Protestants, we don't have presidents who are Protestants. The idea is that we need to pursue these positions to be effective.\n\nThe other way of thinking, more represented by people like Carl Trueman, says: Look, the Bible says that the world is going to think that your ideas are foolishness. So if you're being faithful to Christ, it's going to be very difficult for you not to be in the margins of society. Carl Trueman is aligned with the idea that if you're being faithful to Scripture and society goes further and further away from the Bible, Christianity by definition is going to be moved more and more to the margins, because the message of the cross is foolishness.\n\nBut the wisdom of God is in what the world thinks is foolishness. It is the message of the God-man succumbing to the power of this world on the cross that saves—the very thing that the world considers foolish God uses to save His people.\n\n### Not About the Messenger, But the Message\n\nIt is not the fact that there is a guy preaching here that is foolishness. It is the message that this guy is preaching. Everybody has their talking heads, right? No matter what position you are, no matter where you are in the political spectrum, where you are in the theological spectrum, you have talking heads. So it's not standing in front of people and presenting an idea that's foolishness.\n\nWhat is foolishness is this idea of saying: Unless you believe in this crucified risen savior, you're going to hell. That is where the foolishness is. But what the world thinks is foolishness is actually the wisdom of God.\n\n### The Jewish and Greek Errors\n\nSee that in verses 22-25. The Jews in verse 22 are looking for a sign and the Greeks are looking for some great wisdom that elevates man. Yet the greatest sign and the greatest wisdom is staring right in their face, and His name is Jesus Christ.\n\nThroughout Jesus's ministry, the Jews kept asking him for signs. Even though He was doing all kinds of signs—He raised Lazarus. They said, \"Oh yeah, if you just gave us a sign or whatever.\" Other things: the leper is not a leper anymore. He's walking on water. Five thousand people are eating. The blind see. The lame walk. The mute speaks—if you just give us a sign. Jesus consistently told them that the biggest sign He would ever give them was the sign of Jonah—His own resurrection.\n\nYet the Jews expected the Messiah to do some freakish signs. The Talmud actually lists one of the signs that the Messiah was going to do when He came. The sign would be this: a cow in the temple would give birth to a lamb. When that happened, you knew the guy that caused that would be the Messiah. Could God do that? Yeah. Yet even if one came back from the dead, they would not believe. That's exactly what happened.\n\nThe Greeks were looking for someone in the tradition of the philosopher king from Socrates who would rule the world through education. How many people, even in church, think that the deliverer of the world is education? If you just can get people educated, things are going to get better. Yet the only redeemer of God's elect is Jesus Christ. Nothing else.\n\nSo Paul gave them the only thing he could give them: Christ and Him crucified.\n\n### One Message for All People\n\nIn verses 23-24, it says:\n\n> \"But we preach Christ crucified to the Jews a stumbling block and to the Greeks foolishness a crucified Messiah was a scandal for the Jews. They couldn't take that a savior who is not able to argue his way out of being crucified is not worthy of the Greeks but to the one who is being saved the message of the crucified Christ is the sweet wisdom of God and the gracious power of our savior.\"\n\nNotice that the message of the cross transcends ethnic culture, ethnicity, and cultural barriers. The Jews and the Greeks are being saved by the same message. I hope you notice there are only two groups of people—the Greeks here are the Gentiles. Jew or Gentile, both are saved by the same message.\n\nRemember Mark Driscoll? It seems like so long ago, right? For a while, Mars Hill was setting the trend. They said we need to redeem culture, and you need to be able to speak to every sub-culture group. So if you want to convert biker gangs, you need to become a biker gang guy. If you're going to reach other groups, and yet Paul says: You know what? I preach to the Jews the Gospel. You know what I preach to the Gentiles? The Gospel.\n\nWe went through eleven examples of Paul preaching. I hope you notice how diverse those groups of people were when you outline those messages. But actually, the bigger ones—if you get Acts 13, Acts 17, Acts 22, and Acts 26 for major sermons of Paul to different audiences—and you outline those sermons, the outlines are exactly the same. The content varies a little bit because you're not going to use a lot of Old Testament quotes to people who didn't know the Bible at all. But it's the same message.\n\nYou don't have to be a cultural expert. You just need to know the Gospel. Notice also that what determined what Paul preached was not popular demand but what the Bible said and what the people needed. Paul keeps preaching the crucified Christ because the most foolish moment of God and the weakest moment of God is vastly superior to anything man can provide.\n\n## Part Three: The Word of the Cross Transforms Nobodies into God's Children\n\nLastly, the word of the cross turns nobodies into sons and daughters of God. See that in verses 26 through 31. This last section here can be a bit hard on our pride because in essence Paul is saying that the Church of Jesus Christ is mostly made up of nobodies who have been redeemed by God through the message of the cross.\n\nIn verse 26, Paul says:\n\n> \"For you see your calling brethren that not many wise according to the flesh not many mighty not many noble are called.\"\n\nDo you follow the logic? So likely, if you're called to follow Jesus, you don't belong to those groups listed there. As a matter of fact, Paul says that those who are called by God are generally the weak things of the world. In verse 27, he says:\n\n> \"But God has chosen the foolish things of the world to put to shame the wise and God has chosen the weak things of the world to put to shame the things which are mighty.\"\n\nPaul can't even get it—I don't know from purpose or what—but he doesn't even call us people. It's not the weak people. He says it's the weak things, right? That he lists here. On top of that, he says that those called by God are generally insignificant in the world. In verse 28:\n\n> \"And the base things of the world and the things which are despised God has chosen and the things which are not to bring to nothing the things that are.\"\n\n### Why God Chose the Weak\n\nWhy did He do that? So that no one can boast before God, that God benefited from saving him or her. God does not need you. God does not need me. There's no boasting in ourselves. So in verse 29, Paul says:\n\n> \"That no flesh should glory in his presence.\"\n\nIt all is all God's grace. In reality, the church is made of sinners made of misfits, and the sooner we realize that, the better.\n\nSadly, the church tends to look more like a depression medicine commercial. Every depression drug commercial has one constant theme. It seems like every one has this imagery of people carrying a little mask with a little happy face on it. Often, that's how we think of the church. Oh man, son, they need to go to church. Everybody there is perfect. Everybody there is happy. I need to put my happy face to go to church.\n\nWhen Paul says nope. Everybody that's there, if they're truly a follower of Jesus Christ, they realize that they are broken, that they can't do it, that they have arrived at the end of their rope and they found Jesus there. The sooner we realize that we don't have it together, the sooner we realize that we can put the façade down, the sooner we realize that we can receive help from one another, the better we are the closer to Christ. In that weakness, then we become like a massive beacon of light.\n\nYears ago, some of you may remember Nick Woolborn. He came in and taught here at the church for a conference we had. He talked about the spirituality of the church. He said that each one of us is like this little light over here by itself—you can barely be seen. But when we're put together and focused on the cross of Christ, we become this beam of light that can shed light everywhere and is seen from everywhere. That's where we need to be.\n\n## Part Four: The Purpose—Glorifying God and Boasting in Christ\n\nThe purpose of all this is to transform us through the message of the cross. There is a great transformation in us both personally and as a body. So in verse 30, Paul says:\n\n> \"But of him you are in Christ Jesus who became for us wisdom from God and righteousness and sanctification and redemption.\"\n\nThe purpose, the goal of doing things this way, is that when a Christian boasts, he boasts in that which is about his God, not about himself. In verse 31:\n\n> \"That as it is written he who glories let him glory in the Lord.\"\n\nHave you seen the joke about the guy who was a vegan cyclist? There's a third thing, but a vegan cyclist—and he became very quiet because he couldn't remember or figure out what he should say first. Yes, because it seems like if you're a cyclist, you'd introduce yourself: \"Hi, I'm Tim, a cyclist.\" Or \"Hi, I'm so-and-so\" who knows. It's just talking about foolish stuff. \"I'm Aiden, a vegan.\" It is never going to be \"a vegan.\" He likes me too much.\n\nBut it seems like the Christian says: \"Hi, I'm Nick, and I boast on the cross of Christ.\" That's our boasting. That's why these things are going on.\n\nVerse 31 is an allusion to Jeremiah 9:23-24 where the Lord says:\n\n> \"Let not the wise man glory in his wisdom but not the mighty man glory in his might nor let the rich man glory in his riches but let him who glories glory in this that he understands and knows me that I'm the Lord exercising loving kindness judgment and righteousness in the earth for in these I delight says the Lord.\"\n\nThe Christian knows what he has been saved from, and he boasts about his God. To boast is just to brag. So Paul says in Galatians 6:14:\n\n> \"God forbid that I should boast except in the cross of our Lord Jesus Christ about whom the world has been crucified to me and I to the world.\"\n\nThis passage teaches us that it is not what we were without Christ that matters but what God has made us to become in Jesus Christ. We went from nobodies to being sons and daughters of Almighty God.", "id": "Unknown-the-word-of-the-cross-god-s-power-and-wisdom-1-corinthians-1-18-31", "source_files": ["1 Corinthians 1-18-31- The Word of the Cross (Pastor Tito Lyro).txt"]};
