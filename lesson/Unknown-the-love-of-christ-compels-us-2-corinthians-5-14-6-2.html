bout us", "A practical way to experience Christ's love is to stop making life about yourself", "Self-forgetfulness allows us to find ourselves in Christ"], "scripture": ["2 Corinthians 5:14-15", "Psalm 16:11"]}, {"title": "Marriage and Singleness Are Not About You", "subpoints": ["Married persons should think about how marriage would be if it were not about their rights, hurts, and demands but about Christ", "Even Christ did not retaliate when reviled, showing His life was not about Himself", "Singles should find the fullness of joy in Christ, not in romantic relationships", "Paul and Christ both lived as single persons and modeled contentment in their state"], "scripture": ["1 Peter 2:21-23", "Philippians 4:11-13"]}, {"title": "Parenting and Being Parented Are Not About You", "subpoints": ["Parents should present Christ to their children rather than conforming them to cultural expectations", "Children's greatest calling is to honor and obey their parents as a way of showing they no longer live for themselves", "Children should receive their parents' instruction as coming from Christ Himself", "Young people should influence friends toward Christ, not away from their parents' rightful guidance", "True friendship means moving friends closer to Christ, not being an anchor keeping them from growth"], "scripture": ["Ephesians 4:29"]}, {"title": "Application to the Doubter, Discouraged, Rebellious, and Unbeliever", "subpoints": ["Doubters should conclude that life is not about them but about Christ; intellectual doubts are solved by Scripture", "Discouragement stems from self-focused comparisons; self-forgetfulness is the remedy", "The rebellious must remember their baptismal profession and return to faith in Christ", "Unbelievers must be reconciled to God through Christ's work of redemption"], "scripture": ["2 Corinthians 5:20", "Psalm 16:11"]}], "tags": [{"tag": "Death to Self", "source": "detected"}, {"tag": "Regeneration", "source": "detected"}, {"tag": "Justification", "source": "detected"}, {"tag": "Christian Living", "source": "detected"}, {"tag": "Love of Christ", "source": "detected"}, {"tag": "Reconciliation", "source": "detected"}], "scripture_references": [{"reference": "2 Corinthians 5:14-6:2", "type": "quoted", "source": "detected"}, {"reference": "2 Corinthians 5:14", "type": "quoted", "source": "detected"}, {"reference": "2 Corinthians 5:15", "type": "quoted", "source": "detected"}, {"reference": "2 Corinthians 5:17", "type": "referenced", "source": "detected"}, {"reference": "2 Corinthians 5:21", "type": "quoted", "source": "detected"}, {"reference": "Matthew 10:39", "type": "quoted", "source": "detected"}, {"reference": "Matthew 16:25", "type": "quoted", "source": "detected"}, {"reference": "Romans 6:5", "type": "quoted", "source": "detected"}, {"reference": "Romans 6:11", "type": "referenced", "source": "detected"}, {"reference": "Galatians 2:20", "type": "quoted", "source": "detected"}, {"reference": "Galatians 3:1-4", "type": "quoted", "source": "detected"}, {"reference": "Ephesians 2:1-10", "type": "quoted", "source": "detected"}, {"reference": "Ephesians 4:29", "type": "quoted", "source": "detected"}, {"reference": "Colossians 3:1-4", "type": "quoted", "source": "detected"}, {"reference": "1 Peter 2:21-23", "type": "quoted", "source": "detected"}, {"reference": "John 10:10", "type": "quoted", "source": "detected"}, {"reference": "Psalm 16:11", "type": "quoted", "source": "detected"}, {"reference": "Philippians 4:11-13", "type": "quoted", "source": "detected"}], "transcript": "## Scripture Reading: 2 Corinthians 5:14-6:2\n\n> For the love of Christ compels us, because we judge thus, that if one died for all, then all died, and he died for all, that those who live should live no longer for themselves, but for him who died for them and rose again. Therefore, from now on, we regard no one according to the flesh. Even though we have known Christ according to the flesh, yet now we know him thus no longer. Therefore, if anyone is in Christ, he's a new creation. Old things have passed away, behold, all things have become new. Now, all things are of God who has reconciled us to Himself through Jesus Christ, and has given us the ministry of reconciliation, that is, that God was in Christ reconciling the world to Himself, not imputing their trespasses to them, and has committed to us the word of reconciliation. Now then, we are ambassadors for Christ, as though God were pleading through us. We implore you on Christ's behalf, be reconciled to God, for he made him who knew no sin to be sinned for us, that we might become the righteousness of God in him. We then, as workers together with him, also plead with you not to receive the grace of God in vain, for he says, in an acceptable time I have heard you, and in the day of salvation I have helped you. Behold, now is the accepted time, behold, now is the day of salvation. (2 Corinthians 5:14-6:2)\n\n## Introduction: The Declaration of Independence and Crossing Lines\n\nDo you know what happened in 1776? In 1776, 56 men signed the Declaration of Independence. Not on July 4th as many think. July 4th was the day the Declaration was approved, but it wasn't signed until August 2nd. The clerk of Congress had to write the Declaration by hand, and most men signed on August 2nd, with some not signing until the end of September.\n\nThe significance was this: by signing, they crossed a line they could not return from. If the American Revolution failed, they would be considered traitors to the British crown. They would lose their property, their freedom, and their lives. They could no longer live as loyal subjects to King George III. Their former identity was gone. They were no longer British citizens. At that moment when they put their names to that document, particularly John Hancock with his large signature, their lives changed. They became Americans.\n\nIn a far greater way, Paul tells us in 2 Corinthians 5 that when Christ died for His people, they died with Him. The old life of living for self came to an end. A new life began. Christians are no longer their own; they belong to Christ. That is why Paul says the love of Christ compels us. Once we understand what Christ has done for us in His death and resurrection, we can no longer view life as being about ourselves. We now live for Him who died and rose again for our sake.\n\nIf you don't want to hear that life is not about you, this would be a good time to get coffee or use the restroom, because that's what we're going to hear today. Life is not about us.\n\n## Part 1: A Brief Review of the Exegesis\n\n### Understanding the Word \"Compels\"\n\nWe have stayed on this passage for our fifth sermon on this very text. We've remained here because this is such an important passage. We need to understand what Paul is saying, because it will transform our lives if we get it.\n\nFirst, let's consider what we've seen in this text before—a brief review of the explanation of this passage and how the words fit together.\n\nIn verse 14 of chapter 5, Paul says:\n\n> For the love of Christ compels us, because we judge thus that if one died for all, then all died. And he died for all, that those who live should live no longer for themselves, but for him who died for them and rose again. (2 Corinthians 5:14-15)\n\nThe word translated \"compels\" carries the idea of control, of exercising great influence—the point being that you cannot do anything about it. It's often used of a crowd thronging you, pressing you from all directions so that you cannot go in any direction except the direction the crowd is taking you. That's what the love of Christ does for Paul.\n\nThe church in Corinth was not a very nice church. We could even categorize it as a pastor killer church. Paul dedicated himself for years to this church, yet as soon as false teachers came in saying false things about Paul, they embraced it. Paul found himself having to defend not himself as a person, but the gospel he preached to them.\n\nWhat kept him going is this: the love of Christ—the love that Christ has for him—controls him in that calling. Paul is so controlled by the love of Christ that there is no other option but to pursue God's calling in his life. The demonstration of the love of Christ is His death. He died for his people. That's where we see the love of Christ for His people.\n\n### Misunderstanding the Extent of Christ's Death\n\nSome scholars look at this passage and see justification for teaching that Christ died for all people equally. But if we carefully read and examine the passage, we see it does not teach that.\n\nNotice that Paul says the love that Christ has controls him because he has concluded or judged or is convinced that the gospel is true. Notice also how Paul describes the gospel in these two verses. One died for all, so all died. Some say, \"See, Paul is teaching that Christ died equally for every human to ever live.\" But then he says that Christ died for all so that all must die. Whoever it is that Christ died for, those people also die. We see here that this is not a physical death, because verse 15 talks about these all also living in Christ. Paul is not teaching that Christ died equally for all.\n\nHere Paul is teaching that Christ died effectively for all who died in the death of the one—our elect—and come to faith in Jesus Christ. Notice that those who died in the death of the one are also the ones who live, but no longer for themselves in verse 15. Nowhere in the Bible do you find a description of unbelievers being those who are alive in Christ. You never find unbelievers being called alive in Christ. So this is not a demonstration that Christ died for all people equally, but that He died effectively for all those who come to faith in Him.\n\nThe death that those who believe in Christ die is the death to self, since they no longer should live for themselves as Paul says in verse 15. Life is living for Him who death itself could not contain. That's what life is.\n\n### What Brings True Life\n\nThat's what Paul means by saying we are a new creation in verse 17. Brothers and sisters, friends, it's not innovation for the sake of attracting people that brings life. It's not a different gospel of therapeutic healing that brings life. Jesus is not the great psychoanalyst in heaven. He didn't come here to solve your problems. It's not affirming that everything your heart wants is good that brings life.\n\nI say that with some pain because my favorite movies are Hallmark movies. In every Hallmark movie you're told to follow your heart. Don't. It's worse than a dead end; it's an abyss. Your heart takes you to the pit of hell.\n\nBrothers and sisters, friends, it is the gospel that brings life, and the love of Christ compels us to place the gospel front and center in everything that we do.\n\n## Part 2: Being Controlled by the Love of Christ Depends on Understanding Christ's Work\n\nWe are only controlled by the love that Christ has for us if we understand correctly what He has done for us. The love of Christ compels and controls Paul because he concluded that those for whom Christ died live, but not for themselves—they live for the sake of Christ because he died for them and in his death they died too.\n\nVerse 14 again: Paul says,\n\n> For the love of Christ compels us because we judge thus. (2 Corinthians 5:14)\n\nThis idea of \"judge\" means concluding, being convinced. Paul concluded that Christ's death is his death to self as well. This is really the paradox of the Christian life: die that you may live. You only start living when you die to self.\n\n### The Paradox: Dying to Live\n\nOur Savior said this countless times. In Matthew 10:39 He says:\n\n> He who finds his life will lose it and he who loses his life for my sake will find it. (Matthew 10:39)\n\nHe's not talking about martyrdom here; He's talking about our dying to self. Again, in Matthew 16:25 on another occasion, He says:\n\n> For whoever desires to save his life will lose it but whoever loses his life for my sake will find it. (Matthew 16:25)\n\nPaul applies this truth in Romans 6:5:\n\n> If we have been united together in the likeness of his death, certainly we also shall be in the likeness of his resurrection. (Romans 6:5)\n\nBrother, sister, if you're united to Christ in his death, you are alive in him. That's the paradox of the Christian faith. Paul himself expresses this in Galatians 2:20:\n\n> I have been crucified with Christ. It is no longer I who live, but Christ lives in me. And the life which I now live is in the flesh. I live by faith in the Son of God who loved me and gave himself for me. (Galatians 2:20)\n\nTrue life is in Christ. In John 10:10 He says:\n\n> I have come that they may have life, and that they may have it more abundantly. (John 10:10)\n\nOur Savior is not selfish. Our Savior is not stingy. He wants you to have life, and that life more abundant.\n\n### When Does This Death Take Place? Regeneration and Justification\n\nWhen does this death to self take place? It takes place in our regeneration and in our justification. Let me explain these two words.\n\nRegeneration is the work of God's Spirit by the word of God in which He convinces us of our sin and misery, enlightens our minds in the knowledge of Christ, and renews our wills. He persuades and enables us to embrace Christ who is freely offered to us in the gospel. This is found in question 31 of the Shorter Catechism, but we see it in the Bible as well.\n\nI'd like you to turn to Ephesians 2, because here Paul clearly teaches that we die to self and come alive to Christ at the moment of our regeneration. The Bible also calls this being born again. Theologians call this our conversion to Christ. These terms all refer to the same reality.\n\nStarting in verse 1, Paul says:\n\n> And you he made alive who were dead in trespasses and sins in which you once walked according to the course of this world, according to the prince of the power of the air, the spirit who now works in the sons of disobedience, among whom also we all once conducted ourselves in the loss of our flesh, fulfilling the desires of the flesh and of the mind, and were by nature children of wrath just as the others. (Ephesians 2:1-3)\n\nThat's all of us in this room. No exception. Even you covenant children who cannot think of a day in which you're not following Christ—at some point the Lord worked in you to transform you so that you are not this. But at one point if you're in Christ, this is a description of you. You brought death, you brought sin, you brought rebellion, you brought unfaithfulness, you brought corruption—you brought everything that's bad to this relationship.\n\nBut then verse 4:\n\n> But God, who is rich in mercy because of his great love with which he loved us, even when we were dead in trespasses, made us alive together with Christ by the grace you have been saved. (Ephesians 2:4-5)\n\nIn the moment He makes us alive in Christ, we die to self. We become alive for Christ, dead to everything that He describes in verses 1 through 3.\n\nSometimes we refer to this work of God in our lives as being born again. That's all that the fancy word regeneration means: \"re\" again, \"generation\" born, starting anew.\n\nWhen we are born again by the Spirit of God, we see the truth and beauty of Christ. We see our need of Him, and then we embrace Him by faith. We believe in Him with saving faith. Our confession, the Westminster Confession of Faith in chapter 14, paragraph 2, tells us that saving faith is this:\n\n> By this faith, a Christian believes to be true whatever is revealed in the word for the authority of God himself speaking therein and acts differently upon that which each particular passage thereof contains, yielding obedience to the commands, trembling at the threatening, and embracing the promise of God for this life and that which is to come. But the principal acts of saving faith are accepting, receiving and resting upon Christ alone for justification, sanctification and eternal life.\n\nPaul tells us this here in Ephesians 2 as well. Looking at verses 8 through 10:\n\n> For by grace you have been saved through faith is that it is that faith that God uses as an instrument for us to be declared righteous in his sight. And that not of yourselves, it is a gift of God, not of works lest anyone should boast for we are his workmanship created in Christ Jesus for good works, which God prepared beforehand that we should walk in them. (Ephesians 2:8-10)\n\nThe moment we place our faith in Christ, God declares us righteous in his sight. That's what justification means. He does that by crediting Christ's obedience in his life to us. The theological term for crediting is imputing.\n\nThen He credits the guilt of our sin to Christ so that when the Father looks at us, He sees us as perfect. Brother, sister, what a glorious thought! If you're believing in Jesus Christ, when the Father looks at you by virtue of your justification, He sees the face of Christ—not your faults, not your flaws, not your unfaithfulness, but the face of Christ.\n\nBack in 2 Corinthians 5:21, the apostle says:\n\n> For he made him who knew no sin to be sin for us, that we might become the righteousness of God in him. (2 Corinthians 5:21)\n\nWhen we believe in Jesus, we are dead to self and live for Him who for our sakes died and rose again.\n\n### The Objective Reality of Our New Status\n\nBrothers and sisters, friends, this is an objective reality. It's not for you to decide—this is true. This is objectively true for everyone who believes in Jesus. \"But I don't feel it.\" It doesn't matter if you believe in Jesus; this is true of you.\n\nThat's why Paul doesn't say \"kill yourselves to sin.\" In Romans 6:11 he says:\n\n> Reckon, recognize, understand that you are dead to sins. (Romans 6:11)\n\nWe are to live in our everyday lives according to this objective reality: that we are dead to sin and alive in Christ Jesus.\n\nPaul expresses this here in our passage in 2 Corinthians 5:14 and 15. He expresses the same objective reality a little differently. We are to live in our day-to-day lives the objective reality that in Christ, we are free to forget self and to live for the sake of Him who for our sake died and for our sake was raised.\n\nIf you want to know how to express this reality in a nutshell, let Galatians 2:20 become your personal confession of faith. Second Corinthians 5:14 and 15 allow us to do that. Galatians 2:20 is Paul's expression of his own faith, but when we see the truth here of 2 Corinthians 5:14 and 15, we are divinely allowed to make Galatians 2:20 our profession of faith:\n\n> I have been crucified with Christ. It is no longer I who live, but Christ lives in me. And the life which I now live is in the flesh. I live by faith in the Son of God who loved me and gave himself for me. (Galatians 2:20)\n\nBrother, sister, this is the glorious life of the one who follows Jesus Christ.\n\nThis truth is found all over the New Testament. Before we move on, let me give you one more passage. I'd love for you to turn to Colossians 3:1-4:\n\n> If then you're raised with Christ, seek those things which are above, wherever Christ is sitting at the right hand of God, set your mind on things above, not on things on the earth. Why? Because for you died and your life is hidden with Christ and God, when Christ with our life appears, then you also appear with Him in glory. (Colossians 3:1-4)\n\nNow you may read the word \"if\" in verse 1 and say, \"Is there a condition here?\" Not really. This is a first-class conditional sentence in Greek, which means the \"if\" clause is true. Since you're raised in Christ (and you are, if you're a believer in Jesus Christ), then what follows is also true of you.\n\nWe can replace the word \"if\" with \"since.\" Since then you're raised with Christ, seek those things which are above, where Christ is sitting at the right hand. Why? Because you died—you died to self—and your life is hidden with Christ in God.\n\n### When Did the Love of Christ Start Controlling Paul?\n\nWhen was it that the love of Christ started controlling Paul? According to 2 Corinthians 5:14 and 15, it started when he concluded in his mind that all who believe in Christ died in Christ and in dying in Christ. Paul no longer had to live for himself but was set free to live for Christ. That's when the love of Christ started to control him—when he came to that realization.\n\nHere's the logical progression: To be controlled by the love of Christ, for us we must know that love that Christ has for us. Paul tells us here that one way to be controlled by the love of Christ is to conclude that life is not about us.\n\nSo very practically, one way to feel the love that Christ has for you is to not make life about you. A certain way to not experience that love (which is objectively true) is by making life about you. Life is about Christ. To be controlled by the love of Christ is to live a life that is about Christ.\n\n## Part 3: Practical Applications of the Reality That Life Is Not About You\n\nI want to spend an extended time on application now, because there are very real, very practical consequences of the reality that this passage teaches us. I want to consider applications for different groups of people.\n\n### Application 1: Marriage and Singleness Are Not About You\n\nIf you're a married person, please pay attention. If you're a single person, please pay attention. Your marriage and your singleness are not about you.\n\nHusbands and wives, think about how your marriage would be if it weren't about you. Think about how your marriage would be if it weren't about your rights, your hurts, your demands. Think about how your marriage would be if it were about Christ living in you.\n\nOne passage that would be significant for us in our marriages, if we live in the reality that we are dead to self and live for Christ, would be 1 Peter 2:21-23:\n\n> For this you were called because Christ also suffered for us leaving us an example that you should follow his steps who committed no sin, nor is deceit found in his mouth, who when he was reviled did not revile in return. When he suffered, he did not threaten, but committed himself to him who judges righteously. (1 Peter 2:21-23)\n\nWhy was Christ able to not retaliate even though He was sinless? Because even His life wasn't about Himself. Can you imagine if our marriages were like that?\n\nNow, singles, by definition a single person is a person who is in a stage of life in which he or she could marry but is not married. High schoolers, you have not yet become single. You should not be looking for or pursuing romantic relationships because you're not ready for marriage yet. You're not single. Only singles are eligible for marriage. You're not eligible for marriage yet. So look to Jesus, not to each other. That's what the lesson here is.\n\nBut seriously, singles, think about how singleness would be if it wasn't about you—about your needs, your desires, your jealousies—but it was about Christ. The fullness of your joy would be in Christ. Remember that Paul wrote the New Testament as a single person. Christ was a single person. And Paul is speaking as a single when he says:\n\n> Not that I speak in regard of need, for I have learned in whatever state I am to be content. I know how to be abased, and I know how to abound everywhere and in all things I've learned both to be full and to be hungry, both to abound and to suffer need. I can do all things through him who strengthens me. (Philippians 4:11-13)\n\nYour marriage, your singleness is not about you.\n\n### Application 2: Parenting and Being Parented Are Not About You\n\nYour parenting and your being parented are not about you.\n\nParents, think about how your parenting would be if it wasn't about you—if you weren't trying to get your children to fit in and do what you or our culture wants them to be. Even if your attempt is to conform your children to a Christian culture, what would your parenting be if your goal wasn't to conform them to something but just to present Christ to them? How different would your parenting be if it were Christ parenting your children?\n\nPaul tells us that we parent for Him who for our sakes died and was raised to life. Do you want what Christ wants for your children—holiness, faithfulness, spiritual growth? Or are you shaping them into your own image instead of Christ's image?\n\nKids, all of you, eye contact right here. I want you to hear this well. I don't want to say names because this is recorded, but I want you to hear this. Kids, your parents' parenting is not about you. Think about how it would be if you received the parenting from your parents as coming from Christ Himself.\n\nYoung and old, as far as kids go, how would the way you relate and respond to your parents change if it wasn't all about you? One of the ways that the love of Christ controls you is in giving you grace and joy to do what Christ calls you to do.\n\nAll of you from the youngest kid in the room to the oldest kid still living with their parents—what God calls you to do, the greatest calling that God has for your life right now is that you honor and obey your parents. Greater than any other call. Greater than what college you're going to go to, what boyfriend or girlfriend you're going to have. None of that is as great a magnitude in your life before Christ than honoring and obeying your parents. This is the primary way that you show that you no longer live for yourself but for Christ who for your sake died and rose.\n\nLittle brothers and sisters, it doesn't matter how much you read your Bible. It doesn't matter how much you say you love Christ. If you're dishonoring your parents, you're faking it. Perhaps you have not come to know the love of Christ for His people.\n\nMoving on in age, but I want all of you to keep hearing this. Middle schoolers, late elementary schoolers, high schoolers—think about how you influence your friends. If you encourage your friends not to follow what their parents have rightfully told them to do, be, or believe, you're encouraging them to be controlled by something other than the love of Christ for them and for you.\n\nWhen you do that, when you influence your friends to go against what their parents say, you're not an influence for Christ. You're an instrument in Satan's direction. You become an instrument not of your Redeemer but of the enemy of your soul, Satan himself.\n\nYour friends are to be closer to Christ because they are your friends. In Ephesians 4:29, Paul is talking about speech, but it applies here. Paul says:\n\n> Let no corrupt word proceed out of your mouth, but what is good for the necessary edification that it may impart grace to your ears. (Ephesians 4:29)\n\nLet me ask you this: Are your friends walking closer to Christ because they have heard you talk? Are your friends loving Jesus more because they are your friends? Are you the cause of their growth in Christ or are you an anchor keeping them from growing in Christ?\n\nIf the love of Christ controls you, you're not going to be an anchor. You're going to be a sail, moving them toward Christ.\n\nAlso, think about how this affects how you let your friends influence you. If a friend is trying to get you to go against what your Christian parents have told you or what you know to be true in the Bible, they are trying (even if they don't realize it) to take you away from the love of Christ. At that moment, they're no friend at all. They are your enemy.\n\n### Application 3: For the Doubter, the Discouraged, the Rebellious, and the Unbeliever\n\nThere's an application here for the doubter, the discouraged, the rebellious, and the unbeliever.\n\n#### To the Doubter\n\nTo the doubters, the greatest solution for your doubts is to conclude with Paul that life is not about you. Life is about Christ who died and who rose again for your sake.\n\nTrue intellectual doubts are easy to deal with because the Bible will stand to any scrutiny. You can bring any question about it. The Bible will stand to it. You don't have to be afraid that somehow somebody somewhere with enough letters after their names is going to find a way that the Bible is not true. People have been trying not just for 2,000 years, but from the beginning of the world to discredit the Bible. And guess what they have not been able to do? Discredit the Bible.\n\nSo intellectual doubts are easy to handle. But could it be that you are hiding behind your doubts simply because you don't want to be controlled by the love of Christ? Could it be that you are afraid that if you let your doubts go, life will no longer be about you? The beauty of what Paul says here is that in self-forgetfulness, we actually find ourselves because we find ourselves in Christ.\n\nWhat David says about Christ in Psalm 16:11 becomes a reality for us:\n\n> You show me the path of life in your presence is fullness of joy at your right hand, our pleasures forevermore. (Psalm 16:11)\n\n#### To the Discouraged\n\nTo the discouraged—which is not the same as the sad—discouragement invariably has to do with comparisons. We are not getting what we think we should get, or we are getting what we think we should not get. It could be material things, relationships, affection. We see others living the life that we want. We don't see the spiritual growth in us that we think should be there. Others don't regard us as highly as we think they should. There are a myriad of other comparisons.\n\nDiscouraged person, do you see how what Paul says here changes the way you think of life and therefore changes your discouragement? Discouragement always has an element of self-focus. If we are convinced that we no longer live for ourselves but we live for the sake of Christ who died and rose again for our sakes, then we are controlled by His love. The life we now live is no longer us living but Christ living in us.\n\nBrothers and sisters, self-forgetfulness is the best remedy for discouragement.\n\n#### To the Rebellious\n\nBut this has something to say to the rebellious as well. You once were baptized and professed faith in Christ but now you don't believe in Him. You're holding back from what you know is true. You're choosing not to live by what you know. But the gospel still applies to you. Christ died and rose again. The invitation still stands. If you'll repent and believe in Him, you will find that the love of Christ is real and that it controls.", "id": "Unknown-the-love-of-christ-compels-us-2-corinthians-5-14-6-2", "source_files": ["The Love of Christ Compels Us- 2 Corinthians 5-14-6-2 (Pastor Tito Lyro).txt"]};
