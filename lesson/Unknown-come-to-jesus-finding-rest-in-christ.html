window.LESSON_DATA = {"title": "Come to Jesus: Finding Rest in Christ", "speaker": "Pastor Tito Lyro", "date": "Unknown", "session": "", "series": null, "series_part": null, "parts": 1, "summary": "This sermon explores Jesus' invitation in Matthew 11:25-30 to all who are burdened and weary to come to Him for rest. Pastor Lyro examines how Christ alone offers true rest through relationship with Him rather than through religious performance, legalism, or self-effort, and calls both believers and unbelievers to continual discipleship under His gentle and lowly lordship.", "outline": [{"title": "The Universal Burden and Jesus' Compassionate Response", "subpoints": ["Everyone experiences exhaustion—physical, emotional, financial, spiritual", "Jesus does not offer techniques or advice, but offers Himself", "Christ's invitation exposes both unbelievers' self-effort and believers' residual legalism", "Judgment is real (woes to Corazin, Bethsaida, Capernaum), yet Jesus graciously calls sinners"], "scripture": ["Matthew 11:25-30", "Matthew 23:4"]}, {"title": "God's Sovereignty and the Free Offer of the Gospel", "subpoints": ["God sovereignly reveals Himself; only Christ can reveal the Father", "The doctrine of election and the free offer of the gospel stand together", "Jesus' unique authority to provide rest through knowing God", "Christ alone provides rest; not found in religious observance, psychology, politics, or money"], "scripture": ["Matthew 11:25-27", "John 6:37"]}, {"title": "The Exclusive, Personal, and Universal Invitation to Come", "subpoints": ["Come to Jesus, not to church, denomination, or moral code", "The invitation is exclusive (come to Him alone), personal (you yourself), and universal (to all who are burdened)", "Coming implies repentance, faith, dependence, and abandoning self-confidence", "Jesus promises divine certainty: 'I will give you rest'", "This invitation stands regardless of hearer's spiritual state or worthiness"], "scripture": ["Matthew 11:28", "Isaiah 1:18", "Isaiah 55:1", "John 7:37-38", "Revelation 22:17"]}, {"title": "The Burden of Legalism and the Freedom of Coming to Christ", "subpoints": ["The Pharisees imposed heavy, burdenless burdens; they bound burdens but lifted no finger to help", "All people struggle to be right with God on their own; this is the universal burden", "Jesus invites the burdened by sin, by trying to earn God's favor, and by suffering", "Believers often reject God's gift of Sabbath rest, holding to burdens by idolatrous self-control"], "scripture": ["Matthew 23:4", "Psalm 38:4", "Jeremiah 6:16-17"]}, {"title": "Taking Christ's Yoke: Discipleship and True Freedom", "subpoints": ["Everyone wears a yoke (sin, career, money, approval, pleasure, etc.); Christ invites exchange, not addition", "True freedom is found under Christ's lordship; the yoke represents submission, direction, service, and discipleship", "Discipleship is lifelong learning through Scripture, prayer, worship, church assembly, and sacraments", "Christ's character (gentle and lowly) makes His yoke bearable despite its demands"], "scripture": ["Matthew 11:29", "John 8:32", "Philippians 2:5-8"]}, {"title": "The Rest of the Soul and the Light Burden", "subpoints": ["Rest is of the soul, not merely physical: forgiveness, peace with God, adoption, reconciliation, hope, security", "Christ's yoke is easy and His burden light because He carried the unbearable burden of the cross", "Unlike legalism, Christ's grace makes obedience joyful", "Because Christ was forsaken, believers are welcome; because Christ bore wrath, believers receive peace"], "scripture": ["Matthew 11:29-30", "Romans 5:1"]}, {"title": "The Movement of Christian Life: Come, Take, Learn, Find", "subpoints": ["Christ never demands worthiness or self-improvement before coming", "The Christian life begins with coming to Jesus and continues by constant coming", "Unbelievers are invited to come in repentance and faith; Christ has never rejected one who truly comes", "Believers continually bring anxieties, temptations, disappointments, and grief to Jesus"], "scripture": ["Matthew 11:28-30"]}], "tags": [{"tag": "Rest in Christ", "source": "detected"}, {"tag": "Discipleship", "source": "detected"}, {"tag": "Legalism", "source": "detected"}, {"tag": "God's Sovereignty", "source": "detected"}, {"tag": "Grace", "source": "detected"}, {"tag": "Invitation of Jesus", "source": "detected"}], "scripture_references": [{"reference": "Matthew 11:25-30", "type": "quoted", "source": "detected"}, {"reference": "Matthew 11:1-24", "type": "referenced", "source": "detected"}, {"reference": "Matthew 23:4", "type": "quoted", "source": "detected"}, {"reference": "John 6:37", "type": "quoted", "source": "detected"}, {"reference": "Psalm 38:4", "type": "quoted", "source": "detected"}, {"reference": "Isaiah 1:18", "type": "quoted", "source": "detected"}, {"reference": "Isaiah 55:1", "type": "quoted", "source": "detected"}, {"reference": "John 7:37-38", "type": "quoted", "source": "detected"}, {"reference": "Revelation 22:17", "type": "quoted", "source": "detected"}, {"reference": "Jeremiah 6:16-17", "type": "quoted", "source": "detected"}, {"reference": "John 8:32", "type": "referenced", "source": "detected"}, {"reference": "Philippians 2:5-8", "type": "referenced", "source": "detected"}, {"reference": "Romans 5:1", "type": "quoted", "source": "detected"}], "transcript": "## Opening and Context\n\nWe are going to turn to Matthew chapter 11, reading verses 25 through 30.\n\n> At that time, Jesus answered and said, I thank you Father, Lord of heaven and earth, that you have hidden these things from the wise and prudent and have revealed them to babes. Even so Father, for so it seemed good in your sight. All things have been delivered to me by my Father and no one knows the Son except the Father. Nor does anyone know the Father except the Son and the one to whom the Son wills to reveal him. Come to me all you who labor and are heavy laden and I will give you rest. Take my yoke upon you and learn from me for I am gentle and lowly in heart and you will find rest for your souls. For my yoke is easy and my burden is light. (Matthew 11:25-30)\n\n## Personal Context for This Message\n\nJust to state the obvious, this is not Second Corinthians. We have been going through Second Corinthians in our Sunday services, but this sermon comes as a result of my own feeling burdened and weary. The last few weeks have been particularly difficult and overwhelming—just the sheer amount of things to get done and the kinds of things that are going on. I felt like I needed Jesus more than anything else, and this passage became my daily morning meditation for the last 21 or so days: \"Come to me and I'll give you rest.\" That is what you're going to receive this morning—the musings of one who really needed Jesus and needs Jesus.\n\n## The Universal Condition of Weariness\n\nI think it is fair to say that everyone longs for rest. I have never met somebody that said, \"No, I just don't want to rest.\" The reality is we live in a world of exhaustion—physical exhaustion, emotional exhaustion, financial burdens, family struggles, anxiety about the future, regrets about the past, guilt over sins, constant pressure to perform. These are just some of the things that burden us and cause us to be weary in our souls, in our minds, in our hearts.\n\nEven despite modern conveniences, people have never seemed more restless than they are now. When you read these verses, Jesus is not speaking about something that is unheard of or only affects a small niche group. When he talks about being burdened and weary, he is talking about the human reality—something that we all share in. He speaks into that universal condition: that we are people who tend to carry burdens and to be wearied by the providence of God in our lives.\n\n## Christ Offers Himself, Not Techniques\n\nDo you notice that when Jesus is talking about burden and weariness, he does not offer advice or techniques? He does not ask to look into your calendar. He does not ask how you have structured your days. He does not tell you how to better manage your time. He does not tell you how to say no to things. Do you notice what he does when he is ministering to the weary and burdened? He does not offer advice or techniques—he offers himself. He says, \"Come to me.\"\n\nAre you burdened? Are you weary? Come to me. These are the words of Jesus.\n\nWhat we see in this passage is Christ as the sole revealer of the Father, showing a sovereign invitation to the weary to find true rest—not in religious performance, but in submission to the Savior, the Lord Jesus Christ. This invitation exposes both the unbelievers' self-effort to be made right with God and the believers' residual legalism—that understanding that somehow it is up to us to continue to be right in the sight of God.\n\n## The Context: Rejection and Judgment\n\nMatthew 11 marks a change in how Jesus was received by the crowds. From this moment on, we see increased rejection of Jesus. In verses 1 through 24, we see rejection of Jesus displayed in different ways.\n\nIn verses 1 through 6, John the Baptist, who had been in prison for calling out Herod's adulterous relationship, is questioning whether Jesus is really the one. He sends disciples to ask Jesus, \"Is this the real thing?\" Jesus responds, \"Look at my message and look at what I am doing and go back and tell John what you have seen.\"\n\nIn verses 7 through 19, Jesus explains John's ministry and then rebukes the unbelief of that generation for not believing John's message—the same message Jesus had: \"Repent, for the kingdom of God is at hand.\"\n\nThen Jesus pronounces woes to Corazin, Bethsaida, and Capernaum in verses 20 through 24 because they had witnessed incredible miracles but refused to repent:\n\n> Then he began to rebuke the cities in which most of his mighty works had been done because they did not repent. Woe to you Corazin, woe to you Bethsaida. For if the mighty works which were done in you had been done in Tyre and Sidon, they would have repented long ago in sackcloth and ashes. But I say to you, it will be more tolerable for Tyre and Sidon on the day of judgment than for you. And you Capernaum, who are exalted to heaven will be brought down to Hades. For if the mighty works which were done in you had been done in Sodom, it would have remained until this day. But I say to you that it shall be more tolerable for the land of Sodom in the day of judgment than for you. (Matthew 11:20-24)\n\nJesus experienced rejection. He went to cities, preached the gospel, performed miracles, and people refused to follow him. They turned their backs on him.\n\nYou may be an unbeliever here today and say, \"If Jesus did all these things, I would come to believe in him.\" But friends, Jesus is doing greater work today. Jesus has changed the hearts of hardened unbelievers to be followers of Jesus Christ. Jesus has given grace to husbands to love their wives. He has given grace to wives to submit to their husbands. He has given grace to children to honor and obey their parents. He has given grace for a bunch of unlikely people to be together as a family. These are greater works than he performed in Chorazin, Bethsaida, and Capernaum. You have the witness of Christ. You have seen the work of Christ. If you do not believe, it is not because you do not think he exists—it is because you do not want to. You prefer to stay burdened. You prefer to stay weary rather than come and be mastered by the Lord Jesus Christ.\n\n## God's Sovereign Revelation and Grace\n\nIt is in this context that Jesus praises his Father:\n\n> At that time, Jesus answered and said, I thank you Father, Lord of heaven and earth, that you have hidden these things from the wise and prudent and have revealed them to babes. Even so Father, for so it seemed good in your sight. All things have been delivered to me by my Father and no one knows the Son except the Father. Nor does anyone know the Father except the Son and the one to whom the Son wills to reveal him. (Matthew 11:25-27)\n\nThe \"wise and prudent\" are those who should have recognized that the works Jesus did among them showed that he was the Messiah. This is primarily directed to the religious leaders of the time—those who were the stewards of the oracles of God, those who were given the word of God to pass on to the people. These were the ones unwilling to see Jesus. They thought themselves too wise, too prudent, too—using a more modern term—too cool for Jesus. And they will go to hell in all their coolness because they were not willing to come to Jesus.\n\nInstead of the great religious leaders receiving Jesus, it was the humble ones who were not self-reliant, who understood who Jesus was. The \"babes\" or little children were the ones that saw what happened, heard the masses, and said, \"Hey, we are all in. That is Jesus. He is our savior. We are going to follow him.\"\n\nThis is one of the reasons why we include children in our services: because Jesus says they hear his voice better than you adults do. They get it in simplicity more than you do. We adults tend to say, \"Oh, it is complicated.\" But our interviews of covenant children coming to become communicant members tend to be clearer in their answers than with actual adults. We ask them questions and they look at us, \"Shouldn't you know that? Why are you asking me that? Yes, Jesus saves and I can only go to heaven if I believe in Jesus. Yes, if I do not believe in Jesus, I will go to hell.\" It is simple, not complicated. And it is to that kind of person that Jesus has shown himself.\n\nNotice two truths held together by Jesus in this passage: One is that God sovereignly reveals himself. Two, Christ sincerely invites all who labor. God sovereignly opens your eyes to see Jesus, yet the invitation goes out to all of you. You are called or invited to come to Jesus. The doctrine of election and the free offer of the gospel stand side by side. The invitation is genuine. Whoever comes will be received.\n\nThe Lord says in John:\n\n> All that the Father gives me will come to me. And the one who comes to me, I will by no means cast out. (John 6:37)\n\nThis is not just for believers, brothers and sisters. Believers in the Lord Jesus Christ often do not come to Jesus because we are afraid that we are going to be rejected by Him. And yet He tells you, believer, I will never cast you out. There is no situation in life. There is no condition. There is no time in which Jesus, when you come to Him, will say, \"I will not see you. I will not receive you.\"\n\n### Christ's Unique Authority\n\nNotice Jesus' unique authority in verse 27: Only Christ can reveal God. There is only Christ who can provide true rest, because it is only in knowing God that you have rest, and only Christ can reveal God to you. So you are not going to find rest in religious observances. It is not going to be in doing church. It is not going to be in obeying the Bible necessarily, as though that is the primary source of rest. You are not going to find rest in psychological insights. You are not going to find rest in political allegiance or politics. You are not going to find rest in money. You can put anything in that list that is not Christ, and the truth is, Christ alone can provide the rest that weary souls desire.\n\n## Christ's Compassionate Invitation\n\nThat is what we find in verse 28:\n\n> Come to me all you who labor and are heavy laden and I will give you rest. (Matthew 11:28)\n\n### The Invitation Stands in the Context of Rejection\n\nNotice first that rejection surrounds this invitation. We see that in the unrepentant cities right before this passage. We see that in the doubting prophet at the beginning of the chapter. We see that in chapter 12 with the hostile scribes coming, trying to condemn Jesus. This invitation is spoken into unbelief—not after it has been resolved. The invitation stands regardless of the hearer's spiritual state at the moment. So to all of us, regardless of your faith, Jesus calls you: come.\n\nBrothers, sisters, friends: Christianity is not first about doing; it is first about coming. Coming to Jesus.\n\n### What Coming to Jesus Implies\n\nComing implies at least four things:\n\nFirst, it implies repentance—turning from sin to Jesus. When you come to Jesus, you leave sin. You are turning. It does not mean that all of a sudden you have no struggle with sin, but you are turning your back to sin. You may still be pretty close to sin, but you are turning your back to sin because you are coming to Jesus.\n\nSecond, coming includes faith—believing that Jesus is who he says he is and that he did what he did for you.\n\nThird, coming includes dependence. I am coming to Jesus because I need him. I need him. The hymn says, \"I need thee every hour,\" but that is too generous. We need Jesus every second. We need him. We need him.\n\nFourth, coming to Jesus implies abandoning self-confidence. Not me, but Jesus. I am coming to you, Jesus, because I already know that I have tried myself. Even as a believer, I have tried to deal with whatever, but I cannot. Not me, but Jesus.\n\n### Biblical Invitations to Come\n\nDo you realize that the Bible is full of invitations to come? In Isaiah:\n\n> Come now and let us reason together, says the Lord. Though your sins are like scarlet, they shall be as white as snow. Though they are red like crimson, they shall be as wool. (Isaiah 1:18)\n\nIn Isaiah 55:\n\n> Oh, everyone who thirsts, come to the waters and you have no money, come buy and eat. Yes, come buy wine and milk without money and without price. (Isaiah 55:1)\n\nOur Lord himself in John says:\n\n> If anyone thirsts, let him come to me and drink. He believes in me, as the scripture has said, out of his heart will flow rivers of living water. (John 7:37-38)\n\nThe Bible ends with an invitation to come:\n\n> The Spirit and the Bride say, Come. And let he who hears say, Come. And let him who thirsts come. Whoever desires, let him have the water of life. (Revelation 22:17)\n\n### The Invitation Answered\n\nYou may say, \"But pastor, I do not know if I can come. I do not know if Jesus is going to accept me.\" To you, he says, come. He says, \"Do not worry about all the other stuff. Just come to me and I will sort it all out.\"\n\nPastor, I believe in Jesus. I follow him, but I have done so many bad things that I still carry the guilt. Jesus says to you, believer: come. Do not try to deal with your guilt on your own. Come.\n\nBut notice where you are supposed to come. The invitation is come to me. Not come to church. Not come to a denomination. Not come to a moral code—do this, do not do that. But come to Christ himself. Now, these things that I mentioned are important, but they flow from this truth: come to Jesus. Jesus is inviting you to be united with him.\n\n## Who Is Invited?\n\nWho are the people who are invited by Jesus? In verse 28, he tells us: \"all who labor and are heavy laden.\"\n\nThese words describe people who are worn out, people who are tired. Jesus is referring to those crushed beneath legalism, beneath religious structures that are all about: do this, do this, do this, do not do that, do this, do not do that. The burden is not merely circumstantial hardships, but specifically religious burdens imposed by religious leaders called Pharisees. More broadly, the burden is trying to stand righteous before a holy God by one's own effort.\n\nAll of you in this room, whether you believe in Jesus or not, know that you need to be right with God. I do not care what you say. I do not care how much you deny it, but in your heart, you know that you need to be right with God. Yet you try so often to do that on your own when you cannot, and that burdens you.\n\nThe Pharisees bound really burdened, heavy burdens on the people. Jesus says:\n\n> For they bind heavy burdens hard to bear and lay them on man's shoulders, but they themselves will not move them with one of their fingers. (Matthew 23:4)\n\nTheir religion offered no assurance, only endless demands. To you, Jesus says: hum.\n\nBecause I think the scriptures allow us to extend this invitation even further to every sinner burdened by the burden of sin. We read this morning in our response to reading Psalm 38:\n\n> For my iniquities have gone over my head like a heavy burden, they are too heavy for me. (Psalm 38:4)\n\nBrothers, sisters, friends: we are often burdened by sin, and to you, Jesus says, come. If you are burdened, if you are weary, come.\n\nThis invitation can also be extended to those burdened by trying to earn God's favor. Many people believe, \"If I am good enough, God is going to receive me. If I try harder, if I improve these areas of my life, God is going to accept me.\" To these people, Christ says: stop carrying what you cannot carry. Just come.\n\nWe can extend this invitation to come to Jesus to those burdened with suffering. Believers carry grief, they carry loss, they carry illnesses, they carry discouragement, they carry temptation, they carry persecution—all kinds of things—and Christ welcomes them too to come to him. This is not an invitation only to unbelievers. Believers who are burdened and heavy-laden will find rest in Christ.\n\nYou know, this is not like a phone carrier. You have seen promotions by phone carriers where only new customers get the good deal, not with Jesus. The old customers—the believers—can also come in their weariness, in their being burdened, and Jesus will give you rest.\n\n### The Characteristics of the Invitation\n\nBut notice what Jesus says: come to me. The invitation is exclusive. Come to him and him only.\n\nNotice that the invitation is also personal. You yourself come to Christ, not someone else on your behalf.\n\nAnd lastly on this invitation, notice that the invitation is universal. It is not qualified: only those who clean up. That is not what Jesus says. It is not restricted to one kind of people. Jesus puts one qualification: that you are burdened or weary. If that describes you, come. Come.\n\n## The Promise and the Objection\n\nThis invitation is followed by a promise: \"I will give you rest.\"\n\nNotice that Jesus does not say that he might give you rest or that perhaps he will give you rest. The promise is he will give you rest. This is divine certainty. Only God can promise rest with such authority.\n\nYou say, \"But pastor, I tried, and I have not really received rest. Have you really done it? Have you come to Christ? Have you been willing to lay all your anxieties, all your burdens?\"\n\nMy experience with people who are burdened is that they sometimes, in a way I do not know what word to use, but in a very idolatrous way, I guess would be the way to put it, enjoy holding to their burdens because that means they are in control. \"Well, I have not found rest in Christ. Have you given all of you?\" That is a dangerous thing because you have nothing of you left. But that is the way of rest. God gives us rest and we often reject it.\n\n### The Rejection of Sabbath Rest\n\nNowhere is that more clear in evangelicalism and in a lot of people in this church than in the rejection of the notion of the Sabbath day. God gives us this great rest. The first day of the week, the day in which our Lord was risen, is our Christian Sabbath. We are able to put aside all our worldly care. We have permission not to work. I find that really nice. That is the precise theological term.\n\nWhen I am tempted to do all the things on my to-do list—you know, there are not enough hours in a day to cut that list shorter—I think, \"You know what, I wish I could, but God tells me I cannot. So I do not have to feel guilty about not doing stuff that I can do in the other six days of the week.\" But how often we reject this notion of Sabbath because we do not want the rest that Jesus gives us. We reject it by doing our own thing, by not trusting that God provides. \"Oh, if I do not work on Sunday, I will not be provided by the Lord.\" Well, test him. Try it out. Or we fill it with stuff that really does not matter.\n\nHave you ever considered that one reason you are burdened is because you have rejected the good gift that God has given you in the Sabbath? Try that out. Come to Jesus in obedience on this matter and see what happens.\n\nJeremiah is a book where God is really concerned with the Sabbath. The prophet says that the reason why Israel was taken captive is because they did not keep the Sabbath. Jeremiah says:\n\n> The Lord says, stand in the ways and see and ask for the old paths where the good way is and walk in it. Walk in the paths that God has given you. Walk in the paths of the Sabbath. Then you find rest for your souls. But they said, We will not walk in it. (Jeremiah 6:16-17)\n\nJesus has come and he gives you rest. He proves that by giving the Sabbath, and we often say, \"Nope, nope. That is not the solution I want. I want some other thing than the divine institution.\"\n\n## A Call to Both Believers and Unbelievers\n\n### To the Unbeliever\n\nUnbelievers, are you exhausted trying to make yourself acceptable before God? Religion cannot save you. Your own efforts to atone or cover up what you have done cannot erase guilt. Only Christ can do that. So stop trying to earn what Christ freely gives. Did you get that? Just take it. Do not keep trying to give something back to Jesus. He already owns everything. He does not need what you have because it already is His.\n\n### To the Believer\n\nBut this speaks to believers as well. Sometimes we continue carrying burdens Christ never intended us to bear. We carry false guilt. We carry constant worry. We carry fear. We carry self-condemnation.\n\nPerhaps it is abortion that you committed in your youth. Perhaps it is your struggle with pornography. Perhaps it is confusion concerning your gender. And we carry that with us as if we are made to carry those things. And Jesus says: come to me.\n\nSometimes it is anxiety. Sometimes it is doubt. Jesus says: come to me.\n\nWe often preach the gospel to others but forget to apply it to ourselves. To you, Jesus says, to us, Jesus says: come to me.\n\nThe Christian life begins with coming to Jesus, but the Christian life continues by constantly coming to Jesus.\n\n## Taking Christ's Yoke and Learning from Him\n\nAnd then Jesus does something that is counter-intuitive. In verse 29, he says, \"Come to me and I'll give you rest.\" And then he says, \"Take my yoke upon you and learn from me.\" This sounds surprising. Jesus promises rest and then he is going to put a yoke on you.\n\nThis is a farming illustration. It does not mean that Jesus is going to put the yolk of an egg on you. The yoke is something that would tie two animals together in order to do work. So Jesus says, \"Come to me and I'll give you rest.\" And the result of that is I am going to put on you a symbol of work. Why?\n\nBecause true freedom is found under Christ's lordship.\n\nThe yoke represents submission, direction, service, discipleship. Christ never offers salvation without discipleship. The truth is all of us are under a yoke. Believer or unbeliever. Everyone who wears a yoke—something controls you. Sin, career, money, approval, pleasure, politics, appearance, family, desire for control, self. These are all things that control us. These are all yokes that are upon us.\n\nSo Christ is not inviting us to go from not having a yoke to having a yoke. He is inviting you to take off that yoke that weighs you down and put on the yoke that sets you free to be and to do what God has designed you to be and do. Christ's yoke gives you freedom. Remember what Jesus says concerning the truth in John 8:\n\n> You shall know the truth. And the truth will set you free. (John 8:32)\n\nWhat is the truth? Jesus says, \"I am the way, the truth and the life.\"\n\n### The Second Invitation: Discipleship\n\nThere is a second invitation in verse 29: \"Take my yoke upon you and learn from me.\" This invitation could be well translated, \"Be my disciple.\" Christianity is lifelong discipleship. The Greek word means continually learning: be learning of me. That is the call of Jesus in our lives.\n\nComing to Jesus begins a lifetime of sitting at his feet. And how do we sit at his feet? By reading the scriptures, but especially by hearing the word of God preached in the worship of God, by praying to him, by not forsaking the assembling of the church.\n\nSome of you might think, \"Oh, the session, the elders just want to control my life. They just want to have people in the church for numbers sake. They keep insisting that I be here on the Lord's day in the service of the Lord because they want to have domain over me.\"\n\nNo, we want you to be here on the Lord's day because that is how you grow in Jesus. That is how you come to Jesus. That is how you learn of Jesus. That is how you continue to be a learner of Jesus. You grow. You sit at his feet by partaking of the sacrament.\n\nBut pastor, I want something big. I want some—what's the guy from Willow Creek? Bill Hybels. He wanted the stuff, right? Talking about the big miracles. Look, God works in the ordinary, everyday things: reading the Bible, praying, being in church, partaking of the sacraments. The little song says, if you want to read your Bible and pray every day, if you want to grow, grow, grow—that is child's talk. But who recognizes Jesus? The children, because they believe that to read your Bible and pray every day, you will grow, grow, grow. So sit at his feet, obey his word.\n\nNot impressions that we have. People come to me saying, \"You know, God told me this week,\" and I feel like, \"Oh, were you reading the Bible aloud? That is how God has spoken to you, if you are reading the Bible aloud.\" Do not follow impressions. Follow what the Bible says, okay? And the Bible says, come to Jesus.\n\nSo believer, ask yourself: Who or what yoke is shaping your thinking? Is it social media? Is it politics? Is it streaming shows? Or is it Christ?\n\nUnbeliever, friend, you already have a master. You are not your own master. Jesus is not inviting you into slavery; he is inviting you out of slavery into a master that you can call friend, brother, savior.\n\n## Christ's Character: Gentle and Lowly\n\nAnd Jesus does not invite us to come blindly. Look what he says at the end of verse 29:\n\n> For I am gentle and lowly in heart, and you will find rest for your souls, for my yoke is easy and my burden is light. (Matthew 11:29-30)\n\nThis is the only place in the gospels where Jesus directly describes his own heart. Here, Christ's heart is gentle. It is not harsh. It is not impatient. It is not cruel. But it is not weak either; it is rightly ordered strength.\n\nChrist's heart is lowly. He is humble, not exalted. We want to see that? Look at the cross. He humbled himself even to the death of the cross. Christ's deity is cloaked in humility. He is lowly. He is accessible. He is approachable. He is compassionate. And this is a heart that delights in receiving sinners.\n\nHe could contrast that heart with the heart of the Pharisees who load burdens without lifting a finger to help. But Christ, Christ's yoke-giving is paired with a character that makes the yoke bearable. The nature of the yoke giver determines the experience of the yoke, and our Savior is gentle, and he is lowly.\n\n## The Rest Promised\n\nAnd the result of coming to Jesus is rest for our souls. Notice that this is not physical rest, though it will likely result in that. It is the rest of the soul: forgiveness, peace with God, adoption, reconciliation, hope, security.\n\nAs the apostle says:\n\n> Having been justified by faith, we have peace with God through our Lord Jesus Christ. (Romans 5:1)\n\nNotice that unlike the yoke of legalism or self-righteousness, Christ's yoke is easy. It does not mean effortless. Christians still suffer. They still battle sin. They experience trials. But Christ carries the greater burden. His grace makes obedience joyful, and his burden is light.\n\nYou know why his burden is light? Because he already carried the heavy burden of the cross for you. He carried the heavy burden so that our burden will be light.\n\n## The Movement of Christian Life\n\nAs we come to the end here, notice the movement of the passage: Come, take, learn, find. This is the Christian life.\n\nChrist never says, \"Clean yourself first, or fix your life first, or become worthy first, and then come.\" He simply tells us to come. The one inviting sinners is the one who later carried the cross. The one promising rest is the one who endured God's judgment. The one offering an easy yoke first bore the unbearable burden of divine wrath for his people.\n\nAnd because Christ was forsaken, believers are welcome. Because Christ bore wrath, believers receive peace. Because Christ carried our burden, we receive rest.\n\n## Final Call to All\n\nSo unbelievers, you may be weary from any number of things: trying to prove yourself, hiding guilt, broken relationships, fear of death, failed religion, shame. Jesus does not invite you to come when you are deserving. He invites the weary. So he invites you to come today. He has never ejected one who truly comes in repentance and in faith.\n\nAnd believers, continue coming to Jesus daily. Bring him your anxieties. Bring him your temptations. Bring him your disappointments. Bring him your grief. I am currently trying to help someone whose son committed suicide. Talk about grief. Do you know what brings hope to someone in that situation? The promise that his son rests in Christ. And not the philosophical discussions about theodicy and why does God allow suffering. The hope is that Christ is gentle. Christ is lowly. Christ is compassionate. Christ receives sinners and he gives rest.", "id": "Unknown-come-to-jesus-finding-rest-in-christ", "source_files": ["Matthew 11-25-30- Come to Jesus (Pastor Tito Lyro).txt"]};
