window.LESSON_DATA = {"title": "Psalm 30 - Joy Comes in the Morning", "speaker": "Unknown Speaker", "date": "Unknown", "session": "", "series": null, "series_part": null, "parts": 1, "summary": "This sermon on Psalm 30 explores how God delivers His people from suffering and sickness, establishing that joy comes through praise and worship even in dark seasons. The message emphasizes that God's anger toward believers is temporary while His favor is eternal, and calls believers to trust in Christ's redemption as proof of God's everlasting mercy. Three applications are presented: the assurance that trials have an expiration date through Christ's resurrection, the warning that prosperity should lead to worship rather than self-reliance, and the calling to live for the purpose of praising God and declaring His truth.", "outline": [{"title": "Personal Deliverance Calls for Individual Praise", "subpoints": ["David was delivered from sickness or near-death through prayer", "This deliverance silenced his foes and glorified God", "Every believer has reasons to praise and exalt the Lord, regardless of circumstances", "Having Christ is to have all"], "scripture": ["Psalm 30:1-3", "Psalm 30:2"]}, {"title": "Corporate Praise and God's Eternal Favor", "subpoints": ["Personal praise leads to corporate worship among the saints", "All believers are saints set apart for the Lord through faith in Christ", "God's name is upon His people, marking them as His own", "God's anger toward His people is momentary, but His favor is permanent", "Joy comes in the morning after the night of weeping"], "scripture": ["Psalm 30:4-5", "2 Corinthians 4:17-18", "Isaiah 54:7-8"]}, {"title": "The Danger of Prosperity and the Correction of Prayer", "subpoints": ["Prosperity can tempt believers toward self-sufficiency instead of trust in God", "David corrected himself, recognizing that his strength came from God's favor", "Fervent prayer and supplication are the appropriate response to trials", "The prayer for mercy acknowledges God's sovereignty and our dependence"], "scripture": ["Psalm 30:6-9"]}, {"title": "Repentance Brings Joy and Transformation", "subpoints": ["Turning from sin results in the joy of the Lord", "God transforms mourning into dancing and replaces sackcloth with gladness", "The purpose of life is to praise God and declare His truth", "Christ's ministry fulfills this transformation through comfort and restoration"], "scripture": ["Psalm 30:11-12", "Luke 4:18-19", "Isaiah 61:1-3"]}, {"title": "Application: Trials Have an Expiration Date in Christ", "subpoints": ["Christ entered the deepest darkness on Good Friday so believers never remain there permanently", "The resurrection guarantees that every believer's sorrows have an end", "Trials may not end quickly in this life, but they cannot have the final word", "Every tear will one day give way to everlasting joy"], "scripture": ["Psalm 30:5"]}, {"title": "Application: Let Prosperity Lead to Worship, Not Self-Confidence", "subpoints": ["Blessings from God should lead to gratitude and worship, not independence", "Every breath, meal, friendship, and success has been purchased by Christ", "God's love is ultimately proven by Christ's death and resurrection, not material circumstances", "Dark hours may be necessary to redirect our trust from gifts to the Giver"], "scripture": ["Psalm 30:6-7"]}, {"title": "Application: Live for the Purpose Christ Redeemed You For", "subpoints": ["Christ saved us not merely from judgment but for worship and witness", "If God has transformed your mourning to dancing, share that grace with others", "The evidence that joy has come is not just improved circumstances but open lips praising God", "Your life should become a testimony of God's grace to those around you"], "scripture": ["Psalm 30:9"]}], "tags": [{"tag": "Joy in suffering", "source": "detected"}, {"tag": "God's faithfulness", "source": "detected"}, {"tag": "Praise and worship", "source": "detected"}, {"tag": "Deliverance", "source": "detected"}, {"tag": "Christ's redemption", "source": "detected"}, {"tag": "Gratitude", "source": "detected"}], "scripture_references": [{"reference": "Psalm 30", "type": "quoted", "source": "detected"}, {"reference": "Psalm 30:1-3", "type": "quoted", "source": "detected"}, {"reference": "Psalm 30:2", "type": "quoted", "source": "detected"}, {"reference": "Psalm 30:4-5", "type": "quoted", "source": "detected"}, {"reference": "2 Corinthians 4:17-18", "type": "quoted", "source": "detected"}, {"reference": "Isaiah 54:7-8", "type": "quoted", "source": "detected"}, {"reference": "Psalm 30:6-9", "type": "quoted", "source": "detected"}, {"reference": "Psalm 30:11-12", "type": "quoted", "source": "detected"}, {"reference": "Luke 4:18-19", "type": "quoted", "source": "detected"}, {"reference": "Isaiah 61:1-3", "type": "quoted", "source": "detected"}, {"reference": "Psalm 30:5", "type": "quoted", "source": "detected"}, {"reference": "Psalm 30:6-7", "type": "quoted", "source": "detected"}, {"reference": "Psalm 30:9", "type": "quoted", "source": "detected"}, {"reference": "Deuteronomy 20", "type": "referenced", "source": "detected"}, {"reference": "Daniel 4", "type": "referenced", "source": "detected"}], "transcript": "## The Gift of Language to Express Our Hearts\n\nI don't know if you like hearing sermons on the Psalms. I love preaching on the Psalms—they're my favorite books. The Psalms give us a language to express the most intimate thoughts of our hearts. They give us a way to talk to God, to express those true questions—questions of why, how long—and to do it in a way that shows we're talking to God, our Redeemer, not to our buddy or somebody who we should be angry with.\n\nThis Psalm is one that really expresses the practice, the life, the real life experience of God's people. Life is not always a bed of roses. Have you ever noticed that? There are ups and downs in life—cancer, broken relationships, sour family members, death, loss of jobs, depression, discouragement. We see that in the life of the Psalmist as he writes this particular Psalm.\n\n## The Context of Psalm 30: Dedication of a House\n\nThe title tells us that this was written when David was dedicating his house to the Lord, his palace. This makes sense, because Deuteronomy 20 says that every house in Israel should be dedicated to the Lord. It's interesting that this particular Psalm eventually became connected with Hanukkah. Hanukkah is a Jewish celebration in December for seven days. The children receive gifts every night for seven days. Hanukkah is the feast celebrating the rededication of the temple in 165 BC, when the sons of Maccabee—the Hasmonean dynasty—took the temple back and rededicated it to the service of the Lord. This Psalm became associated because it's a Psalm of dedication of a house.\n\nDavid in this Psalm tells us that each individual believer has reasons to praise the Lord.\n\n## Part One: Personal Deliverance Leads to Individual Praise (Verses 1-3)\n\n> \"I will extol you, O Lord, for you have lifted me up and have not let my foes rejoice over me. O Lord, my God, I cried out to you and you healed me. O Lord, you brought my soul up from the grave. You have kept me alive that I should not go down to the pit.\"\n\nDavid starts by praising the Lord for deliverance. It seems like David had been very sick or perhaps close to death. God delivered him from that sickness. The deliverance worked to shut up David's foes, who are also God's foes. And the deliverance came as a result of prayer.\n\nThe point is that each one of us has reasons to praise the Lord, to extol him, to exalt him. We can breathe. We have air to breathe. If that's all that you can think of, that still is a reason to give praise to the Lord. We are here together worshiping the God of the universe. He gave us access to him through the Lord Jesus Christ. And even if, as a believer, everything in your life stinks—your marriage is bad, your kids are walking from the Lord, you're unemployed, you live in poverty—yet you have the Lord Jesus Christ. And to have him is to have all. So all of us have reason to exalt, to extol, to praise, to glorify our Savior.\n\n## Part Two: Personal Praise Leads to Corporate Praise (Verses 4-5)\n\n> \"Sing praise to the Lord, you saints of his, and give thanks at the remembrance of his holy name. For his anger is but for a moment, his favor is for life. Weeping may endure for a night, but joy comes in the morning.\"\n\nWhat had been a singular activity—the activity of David—now becomes a corporate one. Notice how David speaks of praising the Lord as the normal activity of the saints. The qualification for praise is that you're a saint. That doesn't mean you're perfect. Saints are those who are set apart by faith for the work of the Lord. If you're a believer in Jesus Christ, you're a saint—you're a holy one set aside for the Lord.\n\nThe saints have plenty of reason to praise the Lord, especially that they are his and marked by his name. The second half of verse four says: \"Give thanks at the remembrance of his holy name.\" God's name is upon you. Back in Viking times, they had a system of naming people. So we have Adam and Malachi is Adam's son. Malachi's name would be Malachi Adam's son. Titus' name would be Titus Adam's son. That's how it is: Chris, God's son; Karen, God's daughter. That's our name. His name is upon us. And because of that, we praise him.\n\n### God's Anger Is Temporary; His Favor Is Permanent\n\nGod's displeasure is real and painful and sometimes experienced, but it's temporary while his grace lasts forever. David says, \"For his anger is but for a moment, his favor is for life.\" Notice that David describes God as being angry with his saints at times. That happens. But his grace, his favor, is permanent. God sometimes displeases us as a father is displeased with their children. We sin, we affect our relationship with God, and there's displeasure there. But his permanent condition toward us is one of grace, is one of favor. And David says that God always delivers his people.\n\n> \"Weeping may endure for a night, but joy comes in the morning.\"\n\nIt's interesting that here it's not just \"joy comes in the morning\"—it's a shout of joy comes in the morning. John Calvin, when he was meditating on this Psalm, said: \"However much God may terrify and humble his faithful servants with many signs of his displeasure, he always besprinkles them with the sweetness of his favor to moderate in his ways their grief.\"\n\nI find agreement with that in 2 Corinthians 4:17-18, where Paul says:\n\n> \"For our light affliction, which is but for a moment, is working for us a far more exceeding and eternal weight of glory.\"\n\nYou might say, \"Pastor, if you really knew what I was going through, you would not call it light and momentary affliction.\" But brother, sister, no matter what it is that we are going through, when compared to seeing Jesus Christ as he is, when staring at the face of our Savior, compared to being with him for all eternity, whatever it is that we're going through now—as deep and hurting as it might be—it is light and it is momentary.\n\nWhen God was speaking to the prophet Isaiah, he said:\n\n> \"For a mere moment I have forsaken you, but with great mercies I will gather you. With a little wrath, I hid my face from you for a moment, but with everlasting kindness, I will have mercy on you, says the Lord your Redeemer.\"\n\nYou might say, \"I don't know. How do I know that? What's the proof?\" The proof is the cross. The proof is God the Father sent the Son to die for you. And more proof yet is that the cross is empty. He rose from the dead and now sits at the right hand of the Father. That's the proof that God gives us.\n\n## Part Three: The Corruption of the Heart in Prosperity (Verses 6-7)\n\nBut the corruption of our hearts is such that the blessings of the Lord can drive us away from him. David says:\n\n> \"Now in my prosperity I said I shall never be moved.\"\n\nWhat's David saying here? When prosperity happened, he trusted in that. He said, \"Look, look at all my riches, look at all that I've done, look at how prosperous I am. There's nothing that can ever happen to me.\" God blesses us and we tend to become self-sufficient and self-reliant because of it instead of trusting in him.\n\nIn those times, the Lord will remind us that these things we are attributing to ourselves are actually blessings from him. So in verse seven, David says:\n\n> \"Lord, by your favor you made my mountain stand strong. You hid your face and I was troubled.\"\n\nDavid himself corrects his thinking there. The corruption of our hearts is indeed a powerful thing. We're so inclined toward self-reliance.\n\n## Part Four: Prayer for Mercy and Life's Purpose (Verses 8-9)\n\nDavid prays a prayer that God desires from all his people:\n\n> \"I cried out to you, O Lord, and to the Lord I made supplication. What profit is there in my blood when I go down to the pit? Will the dust praise you? Will it declare your truth? Hear, O Lord, and have mercy on me. Lord, be my helper.\"\n\nWhat is the prayer that God wants us all to pray? \"Have mercy on me, Lord.\" He always answers that prayer.\n\nDavid holds on to God's promise of establishing his kingdom that have not yet been accomplished. He prays here from the perspective of humanity. He says, \"Lord, what blessing am I going to be to other people if I'm dead? If the Lord takes me now, what good will I be to the people around me? If the Lord takes me now before the promises of God that he made to me come to pass, what will people think?\" That's what David's praying here. \"Lord, if you take me now, all the promises you made to me, they haven't come to pass yet. What will people think of you? So have mercy on me.\"\n\nIn his prayer, David gives us two extremely important objectives of being alive. He says, \"Lord, keep me alive so that I can praise you and declare your truth.\" He shows us that in verse nine:\n\n> \"To the end that my glory may sing praise to you and not be silent.\"\n\nDo you want to know why you're here? Do you want to know why you may be going through whatever trial you're going through? Do you know why you're going through the turmoil you may be going through? So that you can praise the Lord and declare his truth. And do you know who might need to hear that truth the most—that you need to declare? Yourself.\n\n## Part Five: Transformation Through Repentance (Verses 11-12)\n\nIn verses 11 and 12, David says:\n\n> \"You have turned for me my mourning into dancing. You have put off my sackcloth and clothed me with gladness to the end that my glory may sing praise to you and not be silent. O Lord, my God, I will give thanks to you forever.\"\n\nIt is in repentance that we find the joy of the Lord. Isn't this the experience of everyone who turns away from their sins? It may not be there all the time, but it's there nonetheless. When we turn from sin, we find the joy of the Lord.\n\nAnd this really is the ministry of Jesus Christ. In Luke 4, he comes back to Nazareth. He's now become a well-known rabbi. He walks into the synagogue on the Sabbath day. The people say, \"Oh, look, that's our guy. You know, the hometown boy is now known all over. Come and preach.\" They hand him the scroll of Isaiah, which is a massive scroll with no chapters or verses. He finds the exact passage that he wants to speak on and he reads, then he sits down and he says, \"This is fulfilled in your hearing today.\"\n\nDo you know what he read? He went toward the end of the scroll of Isaiah in what today is chapter 61. He read this:\n\n> \"The Spirit of the Lord God is upon me because the Lord has anointed me to preach good tidings to the poor. He has sent me to heal the brokenhearted, to proclaim liberty to the captives and the opening of the prison to those who are bound, to proclaim the acceptable year of the Lord and the day of vengeance of our God, to comfort all who mourn, to console those who mourn in Zion, to give them beauty for ashes, the oil of joy for mourning, the garment of praise for the spirit of heaviness, that they may be called trees of righteousness, the planting of the Lord, that he may be glorified.\"\n\nThat's what Christ does. Beauty from ashes, joy from mourning. Christ does that.\n\n## Three Applications of Psalm 30\n\n### Application One: Your Darkest Night Is Not the End\n\nThis Psalm says something to those who are suffering. It says this: Your darkest night is not the end because Christ has secured your morning. Some of you are living in the night that David describes. Perhaps it's sickness or grief or depression or loneliness or the painful consequences of sin. And you wonder if the morning ever will come. Have you ever had a hard night to sleep where you can't fall asleep? You just keep waiting to see some sort of sign that the morning is there, and it just seems like it takes forever and ever and ever. That's kind of where David is in Psalm 30. And that might be where you are. You wonder if the morning will ever come.\n\nBrother, sister, the Gospel tells us that it will come. The greatest night in the history of all history fell on Good Friday. When darkness covered the land and the Son of God cried out, \"My God, my God, why have you forsaken me?\" Christ entered the deepest, darkest darkness so that his people never remained there forever. And the third day, what happened? The morning came. The resurrection guarantees that every believer's sorrows have an expiration date. Everyone, you can take that to the bank.\n\nNow, that doesn't mean that every trial ends quickly in this life, but it does mean that no trial can have the final word. Because Christ lives, every tear will one day give way to everlasting joy. Some of us will see that right away. Some of us will have to wait till we go see Jesus face to face, but it will happen.\n\n### Application Two: Let God's Blessings Lead You to Worship, Not Self-Confidence\n\nThe Psalm also has something to say to those prospering today. Most of us have things pretty good. What's our trial? They forgot to put the two shots we ordered in a latte. That's like, \"Wow, we're going through a big trial.\" Most of us are prospering. And to us, this Psalm says: Let God's blessings lead you to worship, not self-confidence.\n\nDavid confessed that prosperity tempted him to say, \"I shall never be moved.\" And how easily we can do the same. When life is comfortable, when our health is good, our families are thriving, our finances are secure, we suddenly begin trusting God's gifts more than God himself. We think, \"Why does God love me? Well, because my kids are walking with the Lord. That's the proof that God loves me.\" Or, \"I have a job that shows that God loves me.\" All these things are evidence of God's love, but the ultimate evidence is Christ died for my sins. And sometimes we might need a dark hour to help us remember that.\n\nThe Gospel reminds us that every blessing comes through Christ. Every breath, every meal, every friendship, every success, every answered prayer has been purchased for us by the one who gave himself for us. Therefore, blessings are not invitations to independence. They're invitations to gratitude. Instead of saying, \"Look what I have built,\" let us say, \"Look what Christ has graciously given.\"\n\nYesterday I was reading Daniel and came across the story of Nebuchadnezzar in chapter 4. Remember what Nebuchadnezzar did? He opened the windows and said, \"My, oh my, look at all that I built. I am so great. Now, I don't know if there's anybody better than I here.\" And remember what happened to him? For the next seven years, he went around eating grass like a cow till he came to his senses and acknowledged that God is sovereign.\n\nBlessings should cause us to look to Christ. \"Look what Christ has graciously given me.\"\n\n### Application Three: Live for the Purpose Christ Has Redeemed You For\n\nAnd then this Psalm has something to say to every believer. And this is what it says: Live for the purpose Christ has redeemed you to fulfill. David says that life has purpose, and the purpose is to praise God and to declare his truth. That purpose finds its fullest expression in Jesus Christ.\n\nChrist did not merely save us from judgment. He saved us for worship and witness. If God has turned your mourning to dancing, don't keep that grace to yourself. Tell others what he has done. If he has forgiven your sins, proclaim his mercy. If he has sustained you through suffering, testify of his faithfulness.\n\nThe greatest evidence that joy has come into your life is not merely that your circumstances have improved, but that your lips have been open to praise God and your life has become a testimony of his grace. The Lord is so good to us. Though we may endure for the night, joy always comes in the morning.", "id": "Unknown-psalm-30-joy-comes-in-the-morning", "source_files": ["Psalm 30- Joy Comes in the Morning (Pastor Tito Lyro).txt"]};
